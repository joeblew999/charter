# The showcase API in TypeScript on Cloudflare Workers: every Fern feature we use, in one small API,
# from an oRPC contract (src/contract.ts). The Worker serves that API (/api/mock) and is also the
# harness that runs the generated TypeScript SDK against it inside workerd (/api/sdk-test).
#   mise install && mise run setup     # tools, then npm packages
#   mise run check                     # every local check (needs Docker, no Cloudflare account)
#   mise tasks                         # all of them
# Every task is one line that sh and Windows' cmd.exe both take: programs, "double quotes", &&. A
# setting is written {{env.NAME}}, which mise fills in itself. Anything else is a
# command of the charter tool, which works on the project it is run in (`help` lists its commands).

[tools]
# The charter tool is Go.
go = "1.27.1"
node = "26.10.0"
# Builds the generated CLI: mise run sdk:cli:build.
rust = "1.98.1"
# Link the CLI for the other systems a release ships it for: mise run sdk:dist:cli.
zig = "0.16.0"
"aqua:rust-cross/cargo-zigbuild" = "0.23.4"
gh = "2.101.0"

[env]
# How the tasks run the charter tool.
CHARTER_TOOL = "go run ../../cmd/charter"
# The local dev port.
API_PORT = "{{ get_env(name='API_PORT', default='5176') }}"
# Where the Worker is deployed (cf deploy prints it; there is no cf command to look it up), and the
# same code as a second Worker, which serves the API the specs describe: on Cloudflare a Worker
# can't open a WebSocket to itself. On another Cloudflare account, set them in mise.local.toml
# (gitignored), then: mise run spec.
API_URL = "{{ get_env(name='API_URL', default='https://charter-showcase-ts.gedw99.workers.dev') }}"
API_MOCK_URL = "{{ get_env(name='API_MOCK_URL', default='https://charter-showcase-ts-api.gedw99.workers.dev') }}"

[task_config]
# The tasks every project shares, and those of its language: charter's tasks/ folder (a project
# includes it from GitHub, by tag). A task defined below takes the place of the shared one.
includes = ["../../tasks/shared", "../../tasks/ts"]

# ---- the project ---------------------------------------------------------------------------------

[tasks.setup]
description = "Install the npm packages: cf (Cloudflare's CLI), Fern's CLI, what the tests import; and build the TypeScript library (../../ts), which src/ and spec.ts import as @charter/ts (a project outside this repo installs it from a GitHub release instead)"
run = "npm ci --no-fund --no-audit --prefix ../../ts && npm run build --prefix ../../ts && npm ci --no-fund --no-audit"

[tasks.check]
description = "Every LOCAL check (no Cloudflare account; needs Docker): the committed specs match the contract, Fern accepts them, the tests in test/ pass, the Worker typechecks, and the SDK works inside workerd"
depends = ["spec:check", "sdk:check-spec", "test", "lint", "test:workerd"]

# ---- the API: run it, test it --------------------------------------------------------------------

[tasks.spec]
description = "Write both specs from the contract (src/contract.ts) into fern/"
run = 'node spec.ts fern/openapi.json fern/asyncapi.json {{env.API_MOCK_URL}}/api/mock'

[tasks."spec:check"]
description = "Fail if a committed spec is stale against the contract"
run = 'node spec.ts --check fern/openapi.json fern/asyncapi.json {{env.API_MOCK_URL}}/api/mock'

[tasks.lint]
description = "Typecheck the Worker: the contract, its oRPC implementation and the SDK test (copies the SDK in first; Docker if it is stale)"
# Both copy the SDK into src/client: not at the same time.
wait_for = ["test:workerd"]
run = "{{env.CHARTER_TOOL}} harness-sync && {{env.CHARTER_TOOL}} exec -quiet cf workers types && {{env.CHARTER_TOOL}} exec tsc"

[tasks.test]
description = "The tests in test/, in Node: the server's routes, and its generated specs give Fern the surface the hand-written ones did"
run = "node --test test/*.test.ts"

[tasks."test:workerd"]
description = "Run Fern's TypeScript SDK inside the Worker, under cf dev: every Fern feature, on Workers"
run = "{{env.CHARTER_TOOL}} harness-test"

# ---- Cloudflare ----------------------------------------------------------------------------------

[tasks.deploy]
description = "REMOTE: deploy the Worker twice (charter-showcase-ts and charter-showcase-ts-api)"
run = "{{env.CHARTER_TOOL}} harness-deploy"

[tasks.live-test]
description = "REMOTE: run Fern's TypeScript SDK inside the deployed Worker"
run = "{{env.CHARTER_TOOL}} harness-test -remote"
