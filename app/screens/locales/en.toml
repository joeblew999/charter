# The text of charter's screens (charter add screen:<name> language-list | language-offer | preferences), the source: charter add
# screen: writes it, and its translations beside it, into an app's catalogs. ICU MessageFormat, as in any catalog.

# charter's screens: the language list, the offer of the page in the reader's language, the time zone and clock dialog.
[screens]
# The language list's name, a landmark around its links to the page in every language (and a good name for a header
# button that jumps to it).
languages = "Languages"
# Above every page until the reader chooses a language, when they chose another or their browser asks for another
# the site has: written in that language, linking to the page in it. {language} is the language's own name ("Deutsch").
also_in = "This page is also in {language}."
# Below intl.also_in, in the same language: a link that turns the offer down and keeps the page in its language.
no_thanks = "No thanks"
# The time zone and clock dialog: its button's name and its title.
preferences = "Time zone and clock"
# Under the dialog's title.
preferences_description = "Dates and times on every page use these settings. Automatic uses your browser's time zone."
# In the dialog while its form loads.
loading = "Loading…"
# The time zone menu's label, and its first choice: the zone the browser (or, until it reports one, the connection)
# is in, {zone} its name ("Automatic (Central European Time)").
time_zone = "Time zone"
time_zone_auto = "Automatic ({zone})"
# The clock menu's label, and its first choice: the language's own clock, {example} a time written in it ("Language
# default (2:30 PM)"). The other choices are example times in a 12-hour and a 24-hour clock.
hour_cycle = "Clock"
hour_cycle_auto = "Language default ({example})"
# The dialog's buttons.
save = "Save"
close = "Close"

# The text gsxui's components write themselves (i18n.T): charter add screen:<name> writes what the app's components use.
# The docs screen: its name (a badge beside the app's name, and the name of the list of its pages),
# the link to the repository ({repository} is its name, "owner/name"), the heading above a page's sections, and the
# link to the page's own file.
docs = "Docs"
docs_on_github = "{repository} on GitHub"
docs_on_this_page = "On this page"
docs_edit = "Edit this page on GitHub"
# The button that switches between the light and the dark theme, as screen readers name it.
# The docs' search: its button and field, and what it says when no page or section matches.
docs_search = "Search the docs"
docs_none = "Nothing found."
theme = "Switch between light and dark"
# The sign-in screen: signing in with a passkey, making an account, signing out, who is signed in ({name}), and what
# the page says when the device or the browser did not go through with it.
sign_in = "Sign in"
sign_in_passkey = "Sign in with a passkey"
sign_up = "Create an account"
sign_up_intro = "New here? Choose a name. Your device keeps the key: there is no password."
name = "Name"
sign_out = "Sign out"
signed_in_as = "Signed in as {name}"
sign_in_failed = "That did not work. Try again."
# The account page: its title, and the tokens someone makes for their programs.
account = "Account"
tokens = "Tokens for your programs"
tokens_intro = "A program sends its token as Authorization: Bearer, and may do what you may."
token_name = "What it is for"
token_new = "Make a token"
token_once = "Copy it now: it is not shown again."
token_revoke = "Revoke"
# Deleting the account: the line that opens it, what goes, and the button that does it.
account_leave = "Delete my account"
account_leave_intro = "This deletes your account, your passkeys and tokens, and what you wrote here. It cannot be undone."
account_leave_confirm = "Yes, delete it"
# The page of everyone who signed up, for whoever may manage people: its title, a role's menu, and its first line.
people = "People"
role = "Role"
people_intro = "Everyone who signed up, and what each may do."
# An invitation, on the people page: its title, what it is, the button that makes one, and the line above its link.
invite = "Invite someone"
invite_intro = "A link that makes whoever signs up through it what you choose. It works once, within the hour."
invite_new = "Make a link"
invite_once = "Send it to them now: it is not shown again."

[gsxui]
close = "Close"
notifications = "Notifications"
# The command list's name, as screen readers hear it.
suggestions = "Suggestions"
# Pagination's own links, and its "…" for pages left out.
previous = "Previous"
next = "Next"
more_pages = "More pages"
# Breadcrumb's "…" for levels left out.
more = "More"
# Carousel's arrow buttons.
previous_slide = "Previous slide"
next_slide = "Next slide"
# Calendar's arrow buttons, and the labels of its month and year menus.
previous_month = "Previous month"
next_month = "Next month"
month = "Month"
year = "Year"
# The sidebar's toggle button, its label, and the description screen readers hear for it on phones.
toggle_sidebar = "Toggle Sidebar"
sidebar = "Sidebar"
displays_the_mobile_sidebar = "Displays the mobile sidebar."
# Breadcrumb's and pagination's names as landmarks, and what screen readers call a carousel and each of its slides.
breadcrumb = "breadcrumb"
pagination = "pagination"
carousel = "carousel"
slide = "slide"
# Pagination's arrow links, as screen readers name them.
go_to_previous_page = "Go to previous page"
go_to_next_page = "Go to next page"
# A spinner, as screen readers name it.
loading = "Loading"
# The calendar's day buttons for today and for a selected day, as screen readers name them. '{date}' is literal, quotes
# included: gsxui's calendar script puts the whole day there ("Thursday, July 9, 2026").
today_date = "Today, '{date}'"
date_selected = "'{date}', selected"
