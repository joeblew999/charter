# The source catalog: every message the app shows, in ICU MessageFormat. Translations are <locale>.toml beside it,
# with the same tables and keys. A comment above a key tells translators where the text appears.

[site]
# The page's title, in the browser's tab and in search results.
title = "Notes, live"
# The page's description, in search results.
description = "A small app on Cloudflare Workers in Go: write a note and it shows at once on every open page."

[home]
# The page's heading.
heading = "Notes"
# Under the heading.
intro = "Write one, and it shows at once on every page open here."
# The text field's hint and its label for screen readers.
placeholder = "Write a note"
label = "Note"
# The button that posts the note.
post = "Post"
# The button on a note that shows when it was written, in full.
when = "When it was written"
# The button on a note that takes it away: its writer has it, and a moderator.
remove = "Remove"
# In place of the form, for a reader who is not signed in: the link to sign in.
sign_in_to_write = "Sign in to write a note"

[docs]
# The link to the docs in every page's header.
nav = "Docs"

[built]
# The section that shows what the app is built with, one page for each job. Its link in the header, its title and
# description in the tab and in search results, its heading and the line under it.
nav = "How it's built"
title = "How it's built"
description = "What a Go app on Cloudflare Workers does with a bucket, a queue, a scheduled task, a key-value store, email, a rate limit and the cache: one page each."
heading = "How it's built"
intro = "Each thing Cloudflare gives the Worker does one job in this app. Open a page to see it work: nothing is used before then."
back = "How it's built"
sign_in = "Sign in to do this"
# What Cloudflare says of the reader's own request, with no binding asked.
facts = "This request"
worker = "Worker"
country = "Country"
city = "City"
time_zone = "Time zone"
colo = "Cloudflare location"
# Attachments (R2).
attachments_title = "Attachments"
attachments_about = "Attach a file to one of your notes. The file is kept in a bucket; the list comes from the database."
file = "File"
note = "Note"
no_note = "No note"
attach = "Attach"
detach = "Remove"
attachments_empty = "No files yet."
# Activity (Queues, a Cron Trigger, D1, a Durable Object). {author} is who wrote the note.
activity_title = "Activity"
activity_about = "Each note is put on a queue and recorded a moment later; once a day a scheduled task counts them. The list is live."
wrote = "{author} wrote a note"
summary = "{count, plural, one {# note} other {# notes}} in the last day"
activity_empty = "Nothing has happened yet."
# Drafts (KV). {when} is how long ago.
drafts_title = "Drafts"
drafts_about = "What you type on the notes page is kept until you post it, so it is there on your next visit, on any device."
draft_saved = "Saved {when}"
draft_none = "You have no draft."
draft_write = "Write a note"
# Mail (email out and in). {to} and {from} are shortened addresses, {when} how long ago.
mail_title = "Mail"
mail_about = "The Worker sends a message to its owner, at most one an hour, and shows the last one it was handed."
mail_send = "Send one"
mail_sent = "Sent to {to}, {when}"
mail_received = "Received from {from}, {when}"
mail_none_sent = "None sent yet."
mail_none_received = "None received yet."
mail_wait = "The next may be sent {when}."
# Limits and cache (a rate limit, the Cache API).
limits_title = "Limits and cache"
limits_about = "Two ways a Worker does less: a limit on how often each caller may write, and an answer kept for a minute where working it out takes a query."
limit_is = "{calls, plural, one {# write} other {# writes}} in {seconds, plural, one {# second} other {# seconds}}, for each caller"
limit_use = "Use one"
limit_allowed = "Allowed."
limit_refused = "Refused: the limit is reached."
report = "{notes, plural, one {# note} other {# notes}} by {authors, plural, one {# person} other {# people}}"
report_cached = "From the cache: worked out {when}."
report_fresh = "Worked out now, and kept for a minute."
took = "Took {time}."
# Outside (fetch, a TCP socket).
outside_title = "Outside"
outside_about = "A request to another site waits on that site, so it is made when you ask, never to show a page."
outside_fetch = "Fetch a page"
outside_socket = "Open a socket"
outside_failed = "It failed."

[gsxui]
close = "Close"
# The command list's name, as screen readers hear it.
suggestions = "Suggestions"

# charter's screens: the language list, the offer of the page in the reader's language, the time zone and clock dialog.
[screens]
# The language list's name, a landmark around its links to the page in every language.
languages = "Languages"
# The language list's name, a landmark around its links to the page in every language (and a good name for a header
# button that jumps to it).
# Above every page until the reader chooses a language, when they chose another or their browser asks for another
# the site has: written in that language, linking to the page in it. {language} is the language's own name ("Deutsch").
also_in = "This page is also in {language}."
# Below intl.also_in, in the same language: a link that turns the offer down and keeps the page in its language.
no_thanks = "No thanks"
# The time zone and clock dialog: its button's name and its title.
preferences = "Time zone and clock"
# Under the dialog's title.
preferences_description = "Dates and times on every page use these settings. Automatic uses your browser's time zone."
# In the dialog while its form loads.
loading = "Loading…"
# The time zone menu's label, and its first choice: the zone the browser (or, until it reports one, the connection)
# is in, {zone} its name ("Automatic (Central European Time)").
time_zone = "Time zone"
time_zone_auto = "Automatic ({zone})"
# The clock menu's label, and its first choice: the language's own clock, {example} a time written in it ("Language
# default (2:30 PM)"). The other choices are example times in a 12-hour and a 24-hour clock.
hour_cycle = "Clock"
hour_cycle_auto = "Language default ({example})"
# The dialog's buttons.
save = "Save"
close = "Close"
# The button that switches between the light and the dark theme, as screen readers name it.
theme = "Switch between light and dark"
# The text gsxui's components write themselves (i18n.T): charter add screen:<name> writes what the app's components use.
# The docs screen: its name (a badge beside the app's name, and the name of the list of its pages),
# the link to the repository ({repository} is its name, "owner/name"), the heading above a page's sections, and the
# link to the page's own file.
docs = "Docs"
docs_on_github = "{repository} on GitHub"
docs_on_this_page = "On this page"
docs_edit = "Edit this page on GitHub"
# The button that switches between the light and the dark theme, as screen readers name it.
# The docs' search: its button and field, and what it says when no page or section matches.
docs_search = "Search the docs"
docs_none = "Nothing found."
# The sign-in screen: signing in with a passkey, making an account, signing out, who is signed in ({name}), and what
# the page says when the device or the browser did not go through with it.
sign_in = "Sign in"
sign_in_passkey = "Sign in with a passkey"
sign_up = "Create an account"
sign_up_intro = "New here? Choose a name. Your device keeps the key: there is no password."
name = "Name"
sign_out = "Sign out"
signed_in_as = "Signed in as {name}"
sign_in_failed = "That did not work. Try again."
# The account page: its title, and the tokens someone makes for their programs.
account = "Account"
tokens = "Tokens for your programs"
tokens_intro = "A program sends its token as Authorization: Bearer, and may do what you may."
token_name = "What it is for"
token_new = "Make a token"
token_once = "Copy it now: it is not shown again."
token_revoke = "Revoke"
# The page of everyone who signed up, for whoever may manage people: its title, a role's menu, and its first line.
people = "People"
role = "Role"
people_intro = "Everyone who signed up, and what each may do."
