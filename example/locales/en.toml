# The source catalog: every message the app shows, in ICU MessageFormat. Translations are <locale>.toml beside it,
# with the same tables and keys. A comment above a key tells translators where the text appears.

[site]
# The page's title, in the browser's tab and in search results.
title = "Notes, live"
# The page's description, in search results.
description = "A small app on Cloudflare Workers in Go: write a note and it shows at once on every open page."

[home]
# The page's heading.
heading = "Notes"
# Under the heading.
intro = "Write one, and it shows at once on every page open here."
# The text field's hint and its label for screen readers.
placeholder = "Write a note"
label = "Note"
# The button that posts the note.
post = "Post"
# Above the list of languages at the foot of the page.
languages = "Languages"

# Text gsxui's own components write.

[bindings]
# The link from the home page to the page of what Cloudflare gives the Worker.
link = "What Cloudflare gives this Worker"
# The Cloudflare page: its title and description, in the tab and in search results.
title = "Cloudflare, one card each"
description = "KV, R2, Queues, D1, Cron Triggers, the Cache API, Durable Objects, sockets, fetch and email on a Cloudflare Worker in Go, each used once."
# Its heading and the line under it.
heading = "What Cloudflare gives this Worker"
intro = "Each card uses one thing through workers-go's own package."
# The link back to the home page.
back = "Back to the notes"
# Shown when the page runs outside a Worker (a test).
off_workers = "This page is running outside a Worker, where there are no bindings: the cards are empty."
# Each card's line of explanation, and its form's labels and buttons.
kv = "A counter in KV: how often this page was opened."
r2 = "A note kept as one object in an R2 bucket."
note = "Note"
save = "Save"
queues = "A message sent to a queue. The consumer takes it a moment later: open the page again to see it."
message = "Message"
send = "Send"
cron = "The schedule that last ran, and when."
d1 = "Rows in the D1 database, counted through workers-go's database/sql driver: the notes of the home page."
cache = "A value kept in the Cache API for a minute. The first visit stores it; the next ones read it."
object = "A Durable Object called through its stub: the hub behind the live list."
socket = "A TCP socket opened to another site, and the first line that came back."
after = "Work that ran after the previous answer had been sent, and when it finished."
request = "What Cloudflare knows of your request: country, city, time zone, data center, protocol."
email = "A message sent through a send_email binding, at most one an hour, and the last one Email Routing handed this Worker."
email_to = "Send to"
fetch = "A request this Worker made to another site."
vars = "A variable of the Worker, from wrangler.jsonc."

[gsxui]
close = "Close"
