# Written by `charter workflows` from its template (github.com/joeblew999/charter, cmd/charter/workflows/check.yml):
# don't edit: change the template, not this file. Every step that does work is a mise task, so it runs locally too.
# The local checks (no Cloudflare account): lint, tests, spec drift, the build, and the live tests natively and under workerd.
name: check
on:
  push:
    branches: [main]
    # A release is cut from a developer's machine: this checks its tag on every OS afterwards.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }} # charter docs -check reads the repo's name and description with gh
jobs:
  # if-dir examples
  # A repo that holds several projects: the tool, the Go and the TypeScript library, and each example
  # in a job of its own, so a failure names its part.
  tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run charter:check
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run go:check
  library-ts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run ts:setup
      - run: mise run ts:check
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [examples/notes-go, examples/notes-ts, examples/start-datastar, examples/start-go, examples/start-htmx, examples/start-ts, conformance/showcase-go, conformance/showcase-ts]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run check
  # Which Windows and macOS jobs to run: all of them on main and on a version tag; on a pull request,
  # those for what it changes (mise run ci:scope says which and why). Linux runs everything always.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tool: ${{ steps.scope.outputs.tool }}
      library: ${{ steps.scope.outputs.library }}
      library-ts: ${{ steps.scope.outputs.library-ts }}
      examples: ${{ steps.scope.outputs.examples }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.0.1
      - id: scope
        run: mise run ci:scope
  # The same tasks on Windows: the tool, both libraries and the examples. Not the SDKs: Fern
  # generates in Linux containers, which GitHub's Windows runners do not run.
  tool-windows:
    needs: scope
    if: needs.scope.outputs.tool == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run charter:check
  library-windows:
    needs: scope
    if: needs.scope.outputs.library == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run go:check
  library-ts-windows:
    needs: scope
    if: needs.scope.outputs.library-ts == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run ts:setup
      - run: mise run ts:check
  example-windows:
    needs: scope
    if: needs.scope.outputs.examples != '[]'
    runs-on: windows-2025
    timeout-minutes: 45
    # One task at a time: here the tasks `go run` the tool from the checkout, and Windows locks the
    # program Go has just built while another task builds it again.
    env:
      MISE_JOBS: "1"
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.scope.outputs.examples) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run check
  # The same on macOS (GitHub's macOS runners have no Docker either, so no SDKs here too).
  tool-macos:
    needs: scope
    if: needs.scope.outputs.tool == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run charter:check
  library-macos:
    needs: scope
    if: needs.scope.outputs.library == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run go:check
  library-ts-macos:
    needs: scope
    if: needs.scope.outputs.library-ts == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run ts:setup
      - run: mise run ts:check
  example-macos:
    needs: scope
    if: needs.scope.outputs.examples != '[]'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.scope.outputs.examples) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run check
  # else
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run check
  # The same check on Windows. (The SDK tasks are not part of it: Fern generates in Linux containers,
  # which GitHub's Windows runners do not run.)
  check-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run check
  # And on macOS.
  check-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run check
  # end
