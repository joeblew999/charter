# Written by `charter adopt` from the kit (github.com/joeblew999/charter, cmd/charter/kit/.github/workflows/charter-sdk-check.yml):
# don't edit: change the template, not this file. Every step that does work is a mise task, so it runs locally too.
# Fern (in Docker): the Go and TypeScript SDKs generate from the committed specs and work, and the
# committed Go SDK (sdk/go) is what the specs generate.
name: sdk-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [go, typescript]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:gen ${{ matrix.group }}
      - run: mise run sdk:check ${{ matrix.group }}
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:publish:check
