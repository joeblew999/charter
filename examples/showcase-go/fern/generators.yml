# The showcase API from the Go contract. openapi.json and asyncapi.json are written by
# `mise run spec` from api/contract.go (never by hand).
# Every Fern feature we use, through standard options only: OAuth client credentials (auth-schemes
# below, the token endpoint in openapi.json), idempotency (x-fern-idempotent), SSE (x-fern-streaming),
# cursor pagination (x-fern-pagination), multipart upload, OpenAPI 3.1 webhooks with HMAC signatures
# (x-fern-webhook-signature), the WebSocket both ways (asyncapi.json), an overlay (overlays.yml) and
# audiences (the typescript-public group).
auth-schemes:
  OAuth:
    scheme: oauth
    type: client-credentials
    client-id-env: SHOWCASE_CLIENT_ID
    client-secret-env: SHOWCASE_CLIENT_SECRET
    get-token:
      endpoint: "POST /oauth/token"
      request-properties:
        client-id: $request.client_id
        client-secret: $request.client_secret
      response-properties:
        access-token: $response.access_token
        expires-in: $response.expires_in

api:
  auth: OAuth
  specs:
    - openapi: openapi.json
      overlays: overlays.yml
    - asyncapi: asyncapi.json

# The same groups, in the same order, in every API (mise run sdk:list).
# Generate one: mise run sdk:gen showcase-go <group>   (output: sdk/out/showcase-go/<group>)
groups:
  # The Go SDK.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          module:
            path: example.com/showcase
            version: "1.22"
          packageName: showcase

  # The TypeScript SDK as sources (.ts): what a release ships.
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          namespaceExport: Showcase
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true

  # The TypeScript SDK compiled (.js + .d.ts): what a Worker or a Node program imports, and what the tests use.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          namespaceExport: Showcase
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true
          outputSourceFiles: false

  # A Rust CLI for the API (Fern's CLI generator, early access).
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.45.1
        output:
          location: local-file-system
          path: ../sdk/out/cli
        config:
          binaryName: showcase

  # Only the showcases. Audiences: the same spec, minus everything not tagged "public" (here: the internal file upload).
  typescript-public:
    audiences:
      - public
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript-public
        config:
          namespaceExport: Showcase
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true
