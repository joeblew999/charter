# Written by `charter-ts spec` from fern/openapi.json and charter.config.ts (sdks): don't edit, change
# those and run npm run spec. Fern's generators are charter-ts's, at the versions it pins.
api:
  specs:
    - openapi: openapi.json
      overlays: overlays.yml
    - asyncapi: asyncapi.json
  auth-schemes:
    OAuth:
      scheme: oauth
      type: client-credentials
      client-id-env: CONFORMANCE_CLIENT_ID
      client-secret-env: CONFORMANCE_CLIENT_SECRET
      get-token:
        endpoint: "POST /api/oauth/token"
        request-properties:
          client-id: $request.client_id
          client-secret: $request.client_secret
        response-properties:
          access-token: $response.access_token
          expires-in: $response.expires_in
    bearer:
      scheme: bearer
      token:
        name: token
    accessClientId:
      header: CF-Access-Client-Id
      name: accessClientId
      env: CONFORMANCE_ACCESS_CLIENT_ID
    accessClientSecret:
      header: CF-Access-Client-Secret
      name: accessClientSecret
      env: CONFORMANCE_ACCESS_CLIENT_SECRET
  auth:
    any:
      - OAuth
      - bearer
      - accessClientId
      - accessClientSecret

# The SDKs. Generate one: npm run sdk -- <group>   (into sdk/out/<group>)
groups:
  # Go: the module npm run sdk -- --publish commits in sdk/go, in a project that keeps it.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.70.5
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          module:
            path: github.com/joeblew999/charter/examples/conformance-go/sdk/go
            version: "1.22"
          packageName: conformance

  # TypeScript, as sources (.ts).
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          namespaceExport: Conformance
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: the SDK's lookups of it are guarded.
          guardProcessEnvAccess: true

  # TypeScript, compiled (.js and .d.ts): what a Worker or a Node program imports.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          namespaceExport: Conformance
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: the SDK's lookups of it are guarded.
          guardProcessEnvAccess: true
          outputSourceFiles: false

  # Python.
  python:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.41.2
        output:
          location: local-file-system
          path: ../sdk/out/python

  # A command-line client, in Rust (Fern's early access).
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.54.0
        output:
          location: local-file-system
          path: ../sdk/out/cli
        config:
          binaryName: conformance

  # TypeScript, only what the contract tags for the audience public.
  typescript-public:
    audiences:
      - public
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript-public
        config:
          namespaceExport: Conformance
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: the SDK's lookups of it are guarded.
          guardProcessEnvAccess: true
