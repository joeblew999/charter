# Written by `charter spec` from fern/openapi.json and charter.toml ([sdks]): don't edit, change
# those and run charter spec. Fern's generators are charter's, at the versions it pins.
api:
  specs:
    - openapi: openapi.json
    - asyncapi: asyncapi.json
  auth-schemes:
    bearer:
      scheme: bearer
      token:
        name: token
    accessClientId:
      header: CF-Access-Client-Id
      name: accessClientId
      env: CHARTER_NOTES_GO_ACCESS_CLIENT_ID
    accessClientSecret:
      header: CF-Access-Client-Secret
      name: accessClientSecret
      env: CHARTER_NOTES_GO_ACCESS_CLIENT_SECRET
  auth:
    any:
      - bearer
      - accessClientId
      - accessClientSecret

# The SDKs. Generate one: charter sdk <group>   (into sdk/out/<group>)
groups:
  # Go: the module charter sdk -publish commits in sdk/go, in a project that keeps it.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.70.5
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          module:
            path: github.com/joeblew999/charter/examples/notes-go/sdk/go
            version: "1.22"
          packageName: notes

  # TypeScript, as sources (.ts).
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          namespaceExport: Notes
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: the SDK's lookups of it are guarded.
          guardProcessEnvAccess: true

  # TypeScript, compiled (.js and .d.ts): what a Worker or a Node program imports.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          namespaceExport: Notes
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: the SDK's lookups of it are guarded.
          guardProcessEnvAccess: true
          outputSourceFiles: false

  # Python.
  python:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.41.2
        output:
          location: local-file-system
          path: ../sdk/out/python

  # A command-line client, in Rust (Fern's early access).
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.54.0
        output:
          location: local-file-system
          path: ../sdk/out/cli
        config:
          binaryName: notes
