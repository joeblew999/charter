# Where this project's secrets are: the macOS keychain (service "fnox"), never a file. This file only
# maps each name to its keychain item, so it is safe to commit; the Cloudflare credentials come from
# the global fnox config. A task that needs them runs them through `charter exec -secrets`. Make
# them once (https://joeblew999.github.io/charter/guides/auth.html); mise run access:setup and
# access:token add the names they keep here:
#   openssl rand -hex 32 | fnox set WRITE_TOKEN -k "charter-notes-ts WRITE_TOKEN" -p keychain
#   openssl rand -hex 32 | fnox set READ_TOKEN -k "charter-notes-ts READ_TOKEN" -p keychain

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
READ_TOKEN= { provider = "keychain", value = "charter-notes-ts READ_TOKEN", description = "charter-notes-ts: a token that may read, not write" }
WRITE_TOKEN= { provider = "keychain", value = "charter-notes-ts WRITE_TOKEN", description = "charter-notes-ts: a token that may write" }
