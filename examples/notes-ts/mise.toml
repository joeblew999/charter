# The notes API in TypeScript on Cloudflare Workers, from an oRPC contract (src/contract.ts).
# The specs (fern/), the SDKs, a CLI and the API docs come from it.
#   mise install && mise run setup     # tools, then npm packages
#   mise run check                     # every local check (no Cloudflare account)
#   mise tasks                         # all of them
# Every task is one line that sh and Windows' cmd.exe both take: programs, "double quotes", &&. A
# setting is written {{env.NAME}}, which mise fills in itself. Anything else is a
# command of the charter tool, which works on the project it is run in (`help` lists its commands).
# The tests a deploy must pass: ../notes-go/test/ (one API, one set of tests).

[tools]
# The charter tool is Go, and so is one client of the soak test.
go = "1.27.1"
node = "26.10.0"
# Builds the generated CLI: mise run sdk:cli:build.
rust = "1.98.1"
# Link the CLI for the other systems a release ships it for: mise run sdk:dist:cli.
zig = "0.16.0"
"aqua:rust-cross/cargo-zigbuild" = "0.23.4"
gh = "2.101.0"

[env]
# The Worker's secrets: every mise run deploy sets them, from fnox (fnox.toml) or, in CI, from the
# repo's GitHub secrets. The local runs and tests use throwaway ones.
WORKER_SECRETS = "READ_TOKEN WRITE_TOKEN"
# The Worker's optional secrets: who else it trusts (Cloudflare Access, an OpenID Connect issuer).
# A deploy sets those the environment has (mise run access:setup puts Access's in fnox); the rest
# stay unset, and the Worker trusts no one that way.
WORKER_OPTIONAL_SECRETS = "ACCESS_TEAM_DOMAIN ACCESS_AUD OIDC_ISSUER OIDC_AUDIENCE"
# How the tasks run the charter tool.
CHARTER_TOOL = "go run ../../cmd/charter"
# The local dev port.
API_PORT = "{{ get_env(name='API_PORT', default='5173') }}"
# Where the Worker is deployed (cf deploy prints it; there is no cf command to look it up). Its first
# label is the Worker's name. On another Cloudflare account, set it in mise.local.toml (gitignored),
# then: mise run spec.
API_URL = "{{ get_env(name='API_URL', default='https://charter-notes-ts.gedw99.workers.dev') }}"
# Optional: an API token instead of cf's OAuth login (`npx cf auth login`).
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

[task_config]
# The tasks any repo takes, those every project shares, and those of its language: charter's tasks/ folders (a project
# includes them from GitHub, by tag). A task defined below takes the place of the included one.
includes = ["../../tasks/repo", "../../tasks/shared", "../../tasks/ts"]

# ---- the project ---------------------------------------------------------------------------------

[tasks.setup]
description = "Install the npm packages: cf (Cloudflare's CLI), Fern's CLI, what the tests import, and @charter/ts (the TypeScript library)"
run = "npm ci --no-fund --no-audit --prefix ../../ts && npm run build --prefix ../../ts && npm ci --no-fund --no-audit"

[tasks.check]
description = "Every LOCAL check (no Cloudflare account): typecheck, the committed specs match the contract, the live and auth tests under workerd, and what is generated matches. (The unit tests of follow(), auth and ratelimit are the library's: mise run ts:check at the repo root)"
depends = ["lint", "spec:check", "sdk:publish:fresh", "test:workerd", "workflows:check", "docs:check"]

# ---- the API: run it, test it --------------------------------------------------------------------

[tasks.spec]
description = "Write both specs from the contract (src/contract.ts) into fern/"
run = 'node spec.ts fern/openapi.json fern/asyncapi.json {{env.API_URL}}'

[tasks."spec:check"]
description = "Fail if a committed spec is stale against the contract"
run = 'node spec.ts --check fern/openapi.json fern/asyncapi.json {{env.API_URL}}'

[tasks.lint]
description = "Typecheck the Worker"
run = "{{env.CHARTER_TOOL}} exec -quiet cf workers types && {{env.CHARTER_TOOL}} exec tsc"

[tasks."test:workerd"]
description = "The live test and the auth test (Access and OIDC, from a test issuer it serves, and the rate limit: 429 over it) against the Worker under workerd (cf dev)"
env = { READ_TOKEN = "local-read-token", WRITE_TOKEN = "local-write-token" }
run = '{{env.CHARTER_TOOL}} with-server -url http://localhost:{port}/api/hello -env PORT={port} -env ACCESS_TEAM_DOMAIN=http://localhost:{port2} -env ACCESS_AUD=test-aud -env OIDC_ISSUER=http://localhost:{port2} -env OIDC_AUDIENCE=https://notes.test -start "cf dev" -run "{{env.CHARTER_TOOL}} migrate-local -port {port}" -run "node ../notes-go/test/live-test.mjs http://localhost:{port}" -run "node ../notes-go/test/auth-test.mjs http://localhost:{port} {port2}"'

# ---- Cloudflare: deploy it, test and measure what is deployed ------------------------------------

[tasks.deploy]
description = "REMOTE: deploy the Worker, then apply pending D1 migrations"
run = "{{env.CHARTER_TOOL}} exec -secrets {{env.CHARTER_TOOL}} deploy"

[tasks.live-test]
description = "REMOTE, writes test notes: SSE + WebSocket, raw and through the generated TypeScript SDK"
depends = ["sdk:ready typescript-dist"]
run = '{{env.CHARTER_TOOL}} exec -secrets node ../notes-go/test/live-test.mjs {{env.API_URL}} && {{env.CHARTER_TOOL}} exec -secrets node ../notes-go/test/sdk-live-test.mjs {{env.API_URL}}'

[tasks.soak]
description = "REMOTE, redeploys the Worker: the real-time matrix, every client x scenario, with the generated SDKs and CLI. --idle <min> for the long-idle case"
depends = ["sdk:ready"]
run = '{{env.CHARTER_TOOL}} exec -secrets node ../notes-go/test/soak.mjs {{env.API_URL}}'

[tasks.bench]
description = "REMOTE, read-only: every GET operation of the deployed Worker, wall time and Cloudflare's CPU time. Add -write to include the ones that change data"
run = '{{env.CHARTER_TOOL}} bench -cpu -warm 30s -spec fern/openapi.json -body "POST /api/notes={\"body\":\"bench\"}"'
