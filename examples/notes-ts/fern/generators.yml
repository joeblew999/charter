# The notes API from the oRPC contract. openapi.json and asyncapi.json are written by `mise run spec`
# from src/contract.ts (never by hand). What Fern needs (SDK names, x-fern-pagination,
# x-fern-streaming) is declared there; the WebSocket channel comes from asyncapi() of @charter/ts (../../ts/src/asyncapi.ts).
api:
  specs:
    - openapi: openapi.json
    - asyncapi: asyncapi.json

# The same groups, in the same order, in every API (mise run sdk:list).
# Generate one: mise run sdk:gen api-ts <group>   (output: sdk/out/api-ts/<group>)
groups:
  # The Go SDK.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          # The same module path as ../notes-go's SDK (the one committed to its sdk/go): the two APIs have the
          # same surface, and ../notes-go/test/soak-go builds against either SDK under this one import path.
          module:
            path: github.com/joeblew999/charter/examples/notes-go/sdk/go
            version: "1.22"
          packageName: notes

  # The TypeScript SDK as sources (.ts): what a release ships.
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          namespaceExport: Notes
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true

  # The TypeScript SDK compiled (.js + .d.ts): what a Worker or a Node program imports, and what the tests use.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          namespaceExport: Notes
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true
          outputSourceFiles: false

  # A Rust CLI for the API (Fern's CLI generator, early access).
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.45.1
        output:
          location: local-file-system
          path: ../sdk/out/cli
        config:
          binaryName: notes
