# Written by `charter check --fix` from fern/openapi.json and charter.toml ([sdks]): don't edit, change
# those and run charter check --fix. Fern's generators are charter's, at the versions it pins.
api:
  specs:
    - openapi: openapi.json
    - asyncapi: asyncapi.json
  auth-schemes:
    bearer:
      scheme: bearer
      token:
        name: token
    accessClientId:
      header: CF-Access-Client-Id
      name: accessClientId
      env: CHARTER_NOTES_ACCESS_CLIENT_ID
    accessClientSecret:
      header: CF-Access-Client-Secret
      name: accessClientSecret
      env: CHARTER_NOTES_ACCESS_CLIENT_SECRET
  auth:
    any:
      - bearer
      - accessClientId
      - accessClientSecret

# The SDKs. Generate one: charter pack <group>   (into sdk/out/<group>)
groups:
  # Go: the module charter pack -publish commits in sdk/go, in a project that keeps it.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.70.5
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          module:
            path: github.com/joeblew999/charter/examples/notes/sdk/go
            version: "1.22"
          packageName: notes

  # Python.
  python:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.41.2
        output:
          location: local-file-system
          path: ../sdk/out/python

  # A command-line client, in Rust (Fern's early access).
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.54.0
        output:
          location: local-file-system
          path: ../sdk/out/cli
        config:
          binaryName: notes
