# Written by `charter tasks` (github.com/joeblew999/charter): don't edit it; after upgrading charter, run it
# again. Every task reads charter.toml through charter. Cloudflare credentials (CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID) come from the environment, else from fnox when it is installed.

["charter:build"]
description = "Build the Worker into build/ (charter build): a Go one with TinyGo (WORKER_COMPILER=go: the standard compiler, in seconds, never to deploy), a TypeScript one bundled with esbuild"
run = 'charter build ${WORKER_COMPILER:+-compiler=$WORKER_COMPILER}'

["charter:dev"]
description = "Build the Worker and run it on local workerd, on charter.toml's port, until Ctrl-C (charter dev)"
run = "charter dev"

["charter:spec"]
description = "After changing the contract, [sdks] or migrations/: both specs from the contract, Fern's settings and the database's code (charter spec)"
run = "charter spec"

["charter:sdk"]
description = "An SDK with Fern (Docker) into sdk/out, by default the TypeScript one (charter sdk; charter sdk -prove proves every client, -publish commits the Go SDK)"
usage = 'arg "[group]" help="a group of fern/generators.yml, e.g. python"'
run = 'charter sdk ${usage_group:-}'

["charter:live-test"]
description = "The standard test and charter.toml's [test] live against the deployed Worker (charter live-test)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || ! command -v fnox >/dev/null; then exec charter live-test; fi
exec fnox exec -- charter live-test
'''

["charter:serve"]
description = "Run the built Worker on local workerd, on charter.toml's port (PORT overrides it), in your time zone (charter serve)"
run = "charter serve"

["charter:with"]
description = "Run a command against the built Worker on local workerd, a free port and fresh state, BASE its URL (charter with)"
usage = 'arg "<command>" var=#true help="the command and its arguments"'
run = 'charter with ${usage_command}'

["charter:token"]
description = "Check the Cloudflare token is active (charter token)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || ! command -v fnox >/dev/null; then exec charter token; fi
exec fnox exec -- charter token
'''

["charter:deploy"]
description = "Deploy the built Worker to production, staging or a preview <name>, as charter.toml says (charter deploy); prints its URL"
usage = '''
arg "<environment>" help="production, staging or preview"
arg "[name]" help="the preview's name, e.g. pr-7"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=("$usage_environment"); [ -z "${usage_name:-}" ] || args+=("$usage_name")
if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || ! command -v fnox >/dev/null; then exec charter deploy "${args[@]}"; fi
exec fnox exec -- charter deploy "${args[@]}"
'''

["charter:tail"]
description = "Stream the deployed Worker's live logs until Ctrl-C (charter tail)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || ! command -v fnox >/dev/null; then exec charter tail; fi
exec fnox exec -- charter tail
'''

["charter:check"]
description = "Everything charter.toml and charter's files in this app should be (charter check): exits 1 on any problem"
run = "charter check"

["charter:ci"]
description = "What CI runs, here (charter ci run, charter.toml's [ci]): the build and the checks; on GitHub also the preview's build and a release"
run = "charter ci run"

["charter:tasks"]
description = "After upgrading charter: these tasks and the Workers Builds launcher again (charter tasks)"
run = "charter tasks"

["charter:skill"]
description = "After upgrading charter: its agent skill again, into .claude/skills/charter (charter skill)"
run = "charter skill"

["charter:workflow"]
description = "After upgrading charter: the CI workflow again, .github/workflows/charter.yml (charter workflow)"
run = "charter workflow"

["charter:builds-configure"]
description = "Set Workers Builds up for the Worker: the repository, .mise/tasks/charter-builds as its build and deploy commands (charter builds configure; Cloudflare credentials)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || ! command -v fnox >/dev/null; then exec charter builds configure; fi
exec fnox exec -- charter builds configure
'''
