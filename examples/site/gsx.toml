class_merger = "github.com/joeblew999/charter/examples/site/ui/merge.Merge"

# gsx's settings for the pages (https://gsxhq.github.io, Configuration). The htmx preset makes
# hx-get, hx-post and the like URL attributes, which gsx checks as it does href; hx-sse:connect,
# from htmx 4's SSE extension, is one too.
url_presets = ["htmx"]

# intl's gsx filters: { t |> date(opts) }, { n |> number }, href={ "/about" |> localize } (intl/README.md).
filter_packages = ["github.com/joeblew999/charter/site/gsxintl/filters"]

[url_attrs]
names = ["hx-sse:connect"]

# intl: a message or an Intl call written in markup renders in the request's language.
[renderers]
"github.com/joeblew999/charter/examples/site/ui/i18n.T" = "github.com/joeblew999/charter/examples/site/ui/i18n.Translate"
"github.com/joeblew999/charter/site/intl.Msg" = "github.com/joeblew999/charter/site/intl.Translate"
"github.com/joeblew999/charter/site/intl.Value" = "github.com/joeblew999/charter/site/gsxintl.Render"
"github.com/joeblew999/charter/site/intl.Plain" = "github.com/joeblew999/charter/site/intl.PlainText"
