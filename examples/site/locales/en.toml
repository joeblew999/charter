# The source catalog: every message the app shows, in ICU MessageFormat. Translations are <locale>.toml beside it,
# with the same tables and keys. A comment above a key tells translators where the text appears.

[site]
# The page's title, in the browser's tab and in search results.
title = "Messages, live"
# The page's description, in search results.
description = "A small site on Cloudflare Workers in Go: post a message and it shows at once on every open page."

[home]
# The page's heading.
heading = "Messages"
# Under the heading.
intro = "Post one, and it shows at once on every page open here."
# The text field's hint and its label for screen readers.
placeholder = "Say something"
label = "Message"
# The button that sends the message.
post = "Post"
# Above the list of languages at the foot of the page.
languages = "Languages"

# Text gsxui's own components write.

[cloud]
# The link from the home page to the Cloudflare page.
link = "What Cloudflare gives this Worker"
# The Cloudflare page: its title and description, in the tab and in search results.
title = "Cloudflare, one card each"
description = "KV, R2, Queues, Cron Triggers, fetch and variables on a Cloudflare Worker in Go, each used once, as simply as it can be."
# Its heading and the line under it.
heading = "What Cloudflare gives this Worker"
intro = "Each card uses one thing through workers-go's own package."
# The link back to the home page.
back = "Back to the messages"
# Shown when the page runs outside a Worker (a test).
off_workers = "This page is running outside a Worker, where there are no bindings: the cards are empty."
# Each card's line of explanation, and its form's labels and buttons.
kv = "A counter in KV: how often this page was opened."
r2 = "A note kept as one object in an R2 bucket."
note = "Note"
save = "Save"
queues = "A message sent to a queue. The consumer takes it a moment later: open the page again to see it."
message = "Message"
send = "Send"
cron = "The schedule that last ran, and when."
fetch = "A request this Worker made, to its own health check."
vars = "A variable of the Worker, and what Cloudflare knows of your request."

[gsxui]
close = "Close"
