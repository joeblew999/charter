# What charter adds to wrangler.jsonc (go doc github.com/joeblew999/charter/internal/project).
health = "/healthz"
url = "https://charter-site.gedw99.workers.dev"

[check]
# The API's contract: charter check --fix writes fern/ from api/contract.go, and api/queries.go from api/queries.sql.
spec = "fern/openapi.json"
db = "sqlc"

# Asked of the Worker: the Cloudflare page, card by card. On wrangler dev (go tool charter test), or deployed
# (go tool charter test --env preview, or --base https://…).
[test]
run = ["go test -count=1 ./test"]

# Where wrangler.jsonc's environments are deployed (go tool charter deploy preview).
[urls]
preview = "https://charter-site-preview.gedw99.workers.dev"

[pack]
name = "Api"

# How it answers search engines (charter seo): charter check audits the site as a crawler reads it. Its live site is
# url, above.
[seo]

# The app's languages (charter intl; go doc github.com/joeblew999/charter/intl/config): BCP 47 ids, the
# source first.
[intl]
locales = ["en", "de", "ar"]
# <locale>.toml per language, ICU MessageFormat; charter build writes the Go package of messages there.
catalogs = "locales"
# Where gsxui add vendors components: their own text is translated from the catalogs' [gsxui].
gsxui = "ui"

# Guidance for whoever translates, people or Claude (charter run todo shows it); "*" is for every language.
[intl.notes]
"*" = ""
