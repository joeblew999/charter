# Written by `dev workflows` from its template (github.com/joeblew999/orpc-api/dev, dev/workflows/sdk-release.yml):
# change the template, not this file. Every step that does work is a mise task, so it runs locally too.
# On a version tag (vX.Y.Z): both APIs' SDK sources, specs and Linux CLIs go onto the GitHub Release. In a repo
# without the dev tool's own release workflow (dev-release), the Go modules get their tags here.
# On a pull request or by hand it is a dry run: the same build, kept as workflow artifacts, nothing published.
name: sdk-release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [sdk/**, dev/**, mise.toml, go.work, rust-toolchain.toml, .github/workflows/sdk-release.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sdk
          path: dist/
          if-no-files-found: error
      - run: mise run release
      # if-dir dev
      # else
      - run: mise run release:tags
      # end
  # amd64 only: the pinned binaryen in mise.toml has no linux/arm64 build, so mise can't install on an arm runner.
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # if-dir api/ts
        api: [api, api-go]
        # else
        api: [api-go]
        # end
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:dist:cli ${{ matrix.api }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-${{ matrix.api }}
          path: dist/
          if-no-files-found: error
      - run: mise run release
