# Fern's own config for this API: one group per SDK language, options under `config:`.
# Options per generator: https://buildwithfern.com/learn/sdks/generators/<lang>/configuration
# Latest generator versions (checked 2026-09-29; Cloudflare pins older ones in cloudflare/forge).
# Generate: mise run sdk:gen petstore <group>   (output: sdk/out/petstore/<group>)
api:
  specs:
    - openapi: openapi.json

groups:
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../../../out/petstore/go
        config:
          module:
            path: example.com/petstore
            version: "1.22"
          packageName: petstore

  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../../../out/petstore/typescript
        config:
          namespaceExport: Petstore

  python:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.34.0
        output:
          location: local-file-system
          path: ../../../out/petstore/python

  # Fern's CLI generator (early access; docs say it needs a FERN_TOKEN): a Rust CLI for the API.
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.44.0
        output:
          location: local-file-system
          path: ../../../out/petstore/cli
        config:
          binaryName: petstore
