# Fern features through standard options only: OAuth client credentials (auth-schemes below, token
# endpoint in openapi.json), idempotency (x-fern-idempotent), SSE (x-fern-streaming), cursor pagination
# (x-fern-pagination), multipart upload, OpenAPI 3.1 webhooks with HMAC signature verification
# (x-fern-webhook-signature), WebSockets (asyncapi.json), an overlay (overlays.yml) and audiences.
# openapi.json and asyncapi.json are written by `mise run showcase:spec` from the oRPC contract in
# sdk/harness/src/contract.ts (never by hand); the harness Worker serves that contract.
# Docs: https://buildwithfern.com/learn/api-definitions/openapi (Authentication, Webhooks, extensions)
# Generate: mise run sdk:gen showcase <group>   (output: sdk/out/showcase/<group>)
auth-schemes:
  OAuth:
    scheme: oauth
    type: client-credentials
    client-id-env: SHOWCASE_CLIENT_ID
    client-secret-env: SHOWCASE_CLIENT_SECRET
    get-token:
      endpoint: "POST /oauth/token"
      request-properties:
        client-id: $request.client_id
        client-secret: $request.client_secret
      response-properties:
        access-token: $response.access_token
        expires-in: $response.expires_in

api:
  auth: OAuth
  specs:
    - openapi: openapi.json
      overlays: overlays.yml
    - asyncapi: asyncapi.json

groups:
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../../../out/showcase/go
        config:
          module:
            path: example.com/showcase
            version: "1.22"
          packageName: showcase

  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../../../out/showcase/typescript
        config:
          namespaceExport: Showcase
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true

  # Audiences: the same spec, minus everything not tagged "public" (here: the internal file upload).
  typescript-public:
    audiences:
      - public
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../../../out/showcase/typescript-public
        config:
          namespaceExport: Showcase
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true

  # Compiled (.js + .d.ts), the way an npm package reaches its users: what sdk/harness (Workers) uses.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../../../out/showcase/typescript-dist
        config:
          namespaceExport: Showcase
          generateWebSocketClients: true
          guardProcessEnvAccess: true
          outputSourceFiles: false

  # Fern's CLI generator (early access): a Rust CLI for this API, including the AsyncAPI channel.
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.44.0
        output:
          location: local-file-system
          path: ../../../out/showcase/cli
        config:
          binaryName: showcase
