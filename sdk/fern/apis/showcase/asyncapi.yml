# WebSocket channel for live note events (AsyncAPI 3). Fern turns it into a typed WebSocket client
# (TypeScript/Python/Java/C#/Rust; Go gets the message types only).
asyncapi: 3.0.0
info:
  title: Showcase live
  version: 1.0.0
servers:
  production:
    host: api.example.com
    protocol: wss
channels:
  liveNotes:
    address: /notes/live
    messages:
      Subscribe:
        $ref: '#/components/messages/Subscribe'
      NoteEvent:
        $ref: '#/components/messages/NoteEvent'
operations:
  sendSubscribe:
    action: send
    channel:
      $ref: '#/channels/liveNotes'
    messages:
      - $ref: '#/channels/liveNotes/messages/Subscribe'
  receiveNoteEvent:
    action: receive
    channel:
      $ref: '#/channels/liveNotes'
    messages:
      - $ref: '#/channels/liveNotes/messages/NoteEvent'
components:
  messages:
    Subscribe:
      payload:
        type: object
        required: [topic]
        properties:
          topic:
            type: string
    NoteEvent:
      payload:
        type: object
        required: [event, id]
        properties:
          event:
            type: string
          id:
            type: string
          body:
            type: string
