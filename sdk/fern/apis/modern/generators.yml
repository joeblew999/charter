# Fern's own config for this API (SSE streaming + cursor pagination, set in openapi.json with
# x-fern-streaming and x-fern-pagination). Options per generator:
# https://buildwithfern.com/learn/sdks/generators/<lang>/configuration
# Generate: mise run sdk:gen modern <group>   (output: sdk/out/modern/<group>)
api:
  specs:
    - openapi: openapi.json

groups:
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../../../out/modern/go
        config:
          module:
            path: example.com/modern
            version: "1.22"
          packageName: modern

  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../../../out/modern/typescript
        config:
          namespaceExport: Modern
