# The API from the Go contract. openapi.json and asyncapi.json are written by `npm run spec`
# from api/contract.go (never by hand). What Fern needs (SDK names, x-fern-*) is declared there.
api:
  specs:
    - openapi: openapi.json
    - asyncapi: asyncapi.json

# The groups.
# Generate one: npm run sdk -- <group>   (output: sdk/out/<group>)
groups:
  # The Go SDK.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          # The project's module with /sdk/go added: the folder `npm run sdk -- --publish` commits this SDK to,
          # so another repo can go get it.
          module:
            path: github.com/joeblew999/charter/go/examples-start-htmx/sdk/go
            version: "1.22"
          packageName: api

  # The TypeScript SDK as sources (.ts): what a release ships.
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          namespaceExport: Api
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true

  # The TypeScript SDK compiled (.js + .d.ts): what a Worker or a Node program imports.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          namespaceExport: Api
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true
          outputSourceFiles: false
