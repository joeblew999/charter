# Written by `charter-ts spec` from fern/openapi.json and charter.config.ts (sdks): don't edit, change
# those and run npm run spec. Fern's generators are charter-ts's, at the versions it pins.
api:
  specs:
    - openapi: openapi.json
    - asyncapi: asyncapi.json

# The SDKs. Generate one: npm run sdk -- <group>   (into sdk/out/<group>)
groups:
  # Go: the module npm run sdk -- --publish commits in sdk/go, in a project that keeps it.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.70.5
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          module:
            path: github.com/joeblew999/charter/go/examples-start/sdk/go
            version: "1.22"
          packageName: api

  # TypeScript, as sources (.ts).
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          namespaceExport: Api
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: the SDK's lookups of it are guarded.
          guardProcessEnvAccess: true

  # TypeScript, compiled (.js and .d.ts): what a Worker or a Node program imports.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          namespaceExport: Api
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: the SDK's lookups of it are guarded.
          guardProcessEnvAccess: true
          outputSourceFiles: false
