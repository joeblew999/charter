# Where this project's secrets are: the macOS keychain (service "fnox"), never a file. This file only
# maps each name to its keychain item, so it is safe to commit; the Cloudflare credentials come from
# the global fnox config. A script that needs them runs under fnox: fnox exec -- npm run deploy.
# Make them once (https://joeblew999.github.io/charter/guides/auth.html):
#   openssl rand -hex 32 | fnox set WRITE_TOKEN -k "charter-conformance-go WRITE_TOKEN" -p keychain
#   openssl rand -hex 32 | fnox set READ_TOKEN -k "charter-conformance-go READ_TOKEN" -p keychain

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
WRITE_TOKEN= { provider = "keychain", value = "charter-conformance-go WRITE_TOKEN" }
READ_TOKEN= { provider = "keychain", value = "charter-conformance-go READ_TOKEN" }
