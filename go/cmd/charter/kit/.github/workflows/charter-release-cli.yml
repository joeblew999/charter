# Written by `charter adopt` from the kit (github.com/joeblew999/charter, cmd/charter/kit/.github/workflows/charter-release-cli.yml):
# don't edit: change the kit, not this file. Every step that does work is a mise task, so it runs locally too.
# The CLI half of charter-release.yml, for a project that ships a CLI (the cli group in fern/generators.yml): charter adopt writes it only there.
# A release is cut from a developer's machine (mise run release -- vX.Y.Z), which builds and attaches
# everything. On its tag this builds it all again on GitHub's machines, as a check, attaches only what the
# Release lacks (everything, if the tag was pushed by hand), rewrites SHA256SUMS, tags the Go modules in
# subdirectories and, if the project has a CLI, starts the Windows one on Windows. On a pull request or
# by hand it is a dry run: the same build, kept as workflow artifacts, nothing published.
name: release-cli
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [fern/**, sdk/**, mise.toml, go.mod, .github/workflows/charter-release-cli.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  # The CLI, if the project has one (the cli group in fern/generators.yml), for Linux and Windows on
  # amd64 and arm64, cross-built with zig (darwin's need a Mac: the release cut from one has them).
  # amd64 only: the binaryen the tool pins has no linux/arm64 build, so mise can't install it on an
  # arm runner.
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the Release's description lists the commits since the last tag
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:dist:cli
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli
          path: dist/
          if-no-files-found: error
      - run: mise run release:publish
  # The Windows CLI the cli job built, started on Windows: no other machine can start it.
  cli-windows:
    needs: cli
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - uses: actions/download-artifact@v7.0.0
        with:
          name: cli
          path: dist/
      - run: mise run sdk:cli:smoke
