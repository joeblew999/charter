# OpenAPI Overlay: change how the SDK looks without editing openapi.json (e.g. a spec you don't own).
# Kept to show the feature on a generated spec. When the contract is yours, say it there instead, as
# a contract does in openapi({ spec }) (x-fern-sdk-group-name and x-fern-sdk-method-name).
overlay: 1.0.0
info:
  title: Conformance SDK naming
  version: 1.0.0
actions:
  - target: $.paths['/api/notes'].get
    update:
      x-fern-sdk-group-name: notes
      x-fern-sdk-method-name: list
  - target: $.paths['/api/notes'].post
    update:
      x-fern-sdk-group-name: notes
      x-fern-sdk-method-name: create
