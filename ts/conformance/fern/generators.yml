# The conformance API from the oRPC contract. openapi.json and asyncapi.json are written by
# `npm run spec` from api/contract.ts (never by hand); the harness Worker serves it.
# Every Fern feature we use, through standard options only: OAuth client credentials beside charter's
# three ways in, any of them (api.auth-schemes below, the token endpoint in openapi.json), idempotency
# (x-fern-idempotent), SSE (x-fern-streaming), cursor pagination (x-fern-pagination), multipart upload, OpenAPI 3.1 webhooks with HMAC signatures
# (x-fern-webhook-signature), the WebSocket both ways (asyncapi.json), an overlay (overlays.yml) and
# audiences (the typescript-public group).
api:
  specs:
    - openapi: openapi.json
      overlays: overlays.yml
    - asyncapi: asyncapi.json
  auth-schemes:
    OAuth:
      scheme: oauth
      type: client-credentials
      client-id-env: CONFORMANCE_CLIENT_ID
      client-secret-env: CONFORMANCE_CLIENT_SECRET
      get-token:
        endpoint: "POST /api/oauth/token"
        request-properties:
          client-id: $request.client_id
          client-secret: $request.client_secret
        response-properties:
          access-token: $response.access_token
          expires-in: $response.expires_in
    # charter's three ways in, as the examples have them (go/lib/auth, charter-lib/auth): a bearer token
    # (one of the API's, or an OpenID Connect access token: the same header, so the spec's oidc scheme
    # is not restated) and a Cloudflare Access service token. They restate the contract's schemes,
    # which Fern needs here or it keeps only the first.
    bearer:
      scheme: bearer
      token:
        name: token
    accessClientId:
      header: CF-Access-Client-Id
      name: accessClientId
      env: CONFORMANCE_ACCESS_CLIENT_ID
    accessClientSecret:
      header: CF-Access-Client-Secret
      name: accessClientSecret
      env: CONFORMANCE_ACCESS_CLIENT_SECRET
  # Any of the four: the SDKs send whichever credentials they were given.
  # Upstream: fern-api/fern#17997 (when fixed: route credentials per operation, endpoint-security)
  auth:
    any:
      - OAuth
      - bearer
      - accessClientId
      - accessClientSecret

# The SDKs. Generate one: npm run sdk -- <group>   (output: sdk/out/<group>)
groups:
  # The Go SDK.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          module:
            path: example.com/conformance
            version: "1.22"
          packageName: conformance

  # The TypeScript SDK as sources (.ts): what a release ships.
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          namespaceExport: Conformance
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true

  # The TypeScript SDK compiled (.js + .d.ts): what a Worker or a Node program imports, and what the tests use.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          namespaceExport: Conformance
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true
          outputSourceFiles: false

  # The Python SDK: what AI and data code calls the API from.
  python:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.41.2
        output:
          location: local-file-system
          path: ../sdk/out/python

  # A Rust CLI for the API (Fern's CLI generator, early access).
  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.45.1
        output:
          location: local-file-system
          path: ../sdk/out/cli
        config:
          binaryName: conformance

  # Only the conformance projects have this group. Audiences: the same spec, minus everything not tagged "public" (here: the internal file upload).
  typescript-public:
    audiences:
      - public
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../sdk/out/typescript-public
        config:
          namespaceExport: Conformance
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true
