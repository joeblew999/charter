# The API from the oRPC contract. openapi.json and asyncapi.json are written by `npm run spec`
# from api/contract.ts (never by hand). What Fern needs (SDK names, x-fern-*) is declared there.
api:
  specs:
    - openapi: openapi.json
    - asyncapi: asyncapi.json

# The groups. Generate one: npm run sdk -- <group>   (output: sdk/out/<group>)
groups:
  # The Go SDK.
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.70.5
        output:
          location: local-file-system
          path: ../sdk/out/go
        config:
          # The Go SDK's module: the project's own with /sdk/go, the folder npm run sdk -- --publish
          # commits it to in a Go project that keeps its Go SDK (charter.config.ts: go.sdk).
          module:
            path: github.com/joeblew999/charter/ts/examples-start/sdk/go
            version: "1.22"
          packageName: api

  # The TypeScript SDK as sources (.ts): what a release ships.
  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript
        config:
          namespaceExport: Api
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true

  # The TypeScript SDK compiled (.js + .d.ts): what a Worker or a Node program imports.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.106.1
        output:
          location: local-file-system
          path: ../sdk/out/typescript-dist
        config:
          namespaceExport: Api
          generateWebSocketClients: true
          # Workers (without nodejs_compat) have no `process`: guard the SDK's env lookups.
          guardProcessEnvAccess: true
          outputSourceFiles: false
