# GoReleaser builds the tool (cmd/charter) and publishes it to the GitHub Release of a version tag.
# Run through mise: `mise run charter:release` (go run ./cmd/charter release-tool). On a tag vX.Y.Z it
# publishes; anywhere else it is a snapshot into dist/, nothing published. The examples' SDK archives
# are added to the same Release by the release workflow.
version: 2
project_name: charter
builds:
  - id: charter
    main: ./cmd/charter
    binary: charter
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # built: what `charter new` pins a new project to when the tool is a downloaded binary.
    ldflags: ["-s -w -X main.built=v{{ .Version }}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name: releases/latest/download/charter_darwin_arm64.tar.gz is then always the
    # newest one, so nothing that links to it goes stale.
    name_template: "charter_{{ .Os }}_{{ .Arch }}"
    files: [README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^Merge "]
release:
  github:
    owner: joeblew999
    name: charter
  # The release workflow's SDK jobs may have created the Release first: add to it.
  mode: append
  replace_existing_artifacts: true
