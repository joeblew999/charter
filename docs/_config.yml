# Written by `charter init` (github.com/joeblew999/charter, docs/_config.yml): don't edit it in another repo, change it in charter.
# GitHub Pages renders this folder as it is, with its built-in Jekyll: there is no build step.
# self/README.md is the home page, and links between pages (other.md) become links between the rendered ones.
# The look (sidebar, search, diagrams) is the Just the Docs theme, loaded by GitHub.
#
# What a page says about itself, at its very top (the sidebar is built from these):
#   ---
#   title: Short title        # in the sidebar
#   nav_order: 3              # position
#   parent: What to do        # optional: sits under the page with this title
#   has_children: true        # on that parent page
#   ---
# The home page, self/README.md, also needs `permalink: /` there.
# The same in every repo: GitHub Pages gives the site its title and description from the repo
# (site.github, which llms.txt reads too).

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins: [jekyll-remote-theme]
color_scheme: light
search_enabled: true
heading_anchors: true
aux_links_new_tab: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top
search:
  heading_level: 3
  previews: 3
  preview_words_before: 4
  preview_words_after: 12
# ```mermaid blocks become diagrams (GitHub renders the same blocks in the repo view).
mermaid:
  version: "12.0.0"
