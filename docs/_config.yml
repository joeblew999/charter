# GitHub Pages renders this folder as it is, with its built-in Jekyll: there is no build of ours.
# README.md is the home page, and links between pages (api-go.md) become links between the rendered ones.
# Switched on once per repo with `mise run docs:pages`. Published at https://joeblew999.github.io/orpc-api/
# The look (sidebar, search, dark mode) is the Just the Docs theme, loaded by GitHub: config only, no code.
# To use this in another project: copy this file, change the four lines below, run the task.
title: orpc-api
description: Contract-first APIs on Cloudflare Workers (oRPC and Go), real-time that doesn't lose data, SDKs generated by Fern
aux_links:
  "GitHub": ["https://github.com/joeblew999/orpc-api"]
gh_edit_repository: https://github.com/joeblew999/orpc-api

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins: [jekyll-remote-theme]
color_scheme: light
search_enabled: true
heading_anchors: true
aux_links_new_tab: true
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top
footer_content: Written in docs/ of the repo, rendered by GitHub Pages.
search:
  heading_level: 3
  previews: 3
  preview_words_before: 4
  preview_words_after: 12
# ```mermaid blocks become diagrams (GitHub renders the same blocks in the repo view).
mermaid:
  version: "12.0.0"
# Quick links at the foot of the sidebar.
nav_external_links:
  - title: Releases
    url: https://github.com/joeblew999/orpc-api/releases
  - title: "Live: oRPC Worker's OpenAPI"
    url: https://orpc-api.gedw99.workers.dev/api/openapi.json
  - title: "Live: Go Worker's OpenAPI"
    url: https://orpc-api-go.gedw99.workers.dev/api/openapi.json

# The sidebar: each page's short title, its order, and what it sits under. Set here, not in the pages,
# so the Markdown stays plain. A new page needs an entry, or it lands at the bottom under its full heading.
defaults:
  - scope: { path: "README.md" }
    values: { title: "Start here", nav_order: 1 }
  - scope: { path: "rules.md" }
    values: { title: "Rules", nav_order: 2 }
  - scope: { path: "api.md" }
    values: { title: "oRPC Worker (api/)", nav_order: 3 }
  - scope: { path: "api-go.md" }
    values: { title: "Go Worker (api-go/)", nav_order: 4 }
  - scope: { path: "sdk.md" }
    values: { title: "Fern SDKs and CLI (sdk/)", nav_order: 5 }
  - scope: { path: "testing.md" }
    values: { title: "Testing", nav_order: 6 }
  - scope: { path: "dev.md" }
    values: { title: "Tasks, workflows, releases", nav_order: 7 }
  - scope: { path: "benchmarks.md" }
    values: { title: "Benchmarks", nav_order: 8 }
  - scope: { path: "upstream.md" }
    values: { title: "Upstream issues", nav_order: 9 }
  - scope: { path: "findings.md" }
    values: { title: "Findings", nav_order: 10 }
  - scope: { path: "plans/next.md" }
    values: { title: "Plans", nav_order: 11, has_children: true }
  - scope: { path: "plans/realtime.md" }
    values: { title: "Real-time design", nav_order: 1, parent: "Plans" }
  - scope: { path: "plans/asyncapi.md" }
    values: { title: "AsyncAPI generator", nav_order: 2, parent: "Plans" }
  - scope: { path: "plans/mcp.md" }
    values: { title: "MCP", nav_order: 3, parent: "Plans" }
  - scope: { path: "plans/performance.md" }
    values: { title: "Performance", nav_order: 4, parent: "Plans" }
  - scope: { path: "plans/microservices.md" }
    values: { title: "Go microservices", nav_order: 5, parent: "Plans" }
