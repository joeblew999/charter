# Every local check, on GitHub: npm run check at the root, the same one you run (charter-ts, every
# project in ts/ and go/ with its tests under workerd, Docker for Fern, the docs). mise installs the
# tools mise.toml pins. A release is cut from your machine: npm run release -- X.Y.Z.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: npm ci
      - run: npm run check
