# Written by `charter init` from charter.toml: don't edit, change charter.toml's [ci.jobs], then charter init.
# A project's Worker deployed to Cloudflare, then its live tests against it. Here: charter ci deploy [<project>]; on GitHub, from here: charter ci deploy [<project>] -remote.
name: self-deploy
on:
  workflow_dispatch:
    inputs:
      project:
        description: The project
        type: choice
        required: true
        options: [examples/conformance-go, examples/conformance-ts, examples/notes-go, examples/notes-ts, examples/start-datastar, examples/start-go, examples/start-htmx, examples/start-ts]
jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.project && format('["{0}"]', inputs.project) || '["examples/conformance-go","examples/conformance-ts","examples/notes-go","examples/notes-ts","examples/start-datastar","examples/start-go","examples/start-htmx","examples/start-ts"]') }}
    uses: ./.github/workflows/charter-ci.yml
    with:
      job: deploy
      project: ${{ matrix.project }}
      runs-on: ubuntu-24.04
      timeout-minutes: 30
    secrets: inherit
