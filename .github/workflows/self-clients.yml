# Written by `charter init` from charter.toml: don't edit, change charter.toml's [ci.jobs], then charter init.
# Every client the conformance projects' fern/generators.yml declares, generated with Fern and proven in its language. Here: charter ci clients [<project>]; on GitHub, from here: charter ci clients [<project>] -remote.
name: self-clients
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: One project (none, every project)
        type: string
        default: ""
jobs:
  clients:
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.project && format('["{0}"]', inputs.project) || '["examples/conformance-go","examples/conformance-ts"]') }}
    uses: ./.github/workflows/charter-ci.yml
    with:
      job: clients
      project: ${{ matrix.project }}
      runs-on: ubuntu-24.04
      timeout-minutes: 60
