# Deploy one project's Worker to Cloudflare, then its live test against it: by hand (Actions, Run
# workflow). The secrets are the repo's GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# and the Worker's own (READ_TOKEN, WRITE_TOKEN for the notes projects).
name: deploy
on:
  workflow_dispatch:
    inputs:
      project:
        description: The project whose Worker to deploy
        type: choice
        options: [go/notes, go/start, go/start-htmx, go/start-datastar, ts/notes, ts/start]
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      READ_TOKEN: ${{ secrets.READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: npm ci
      - run: npm run deploy -w ${{ inputs.project }}
      - run: npm run live-test -w ${{ inputs.project }}
