# charter's own deploy: the jobs of a repo that holds several projects (the tool, the libraries, examples/).
# Charter's own file, not the kit's: a project gets cmd/charter/kit/.github/workflows/charter-deploy.yml.
# By hand only: deploy the Worker to Cloudflare, apply its D1 migrations, then run the live test against
# what was deployed (some failures only show on Cloudflare itself). Needs the secrets below
# (mise run cloudflare:secrets copies them; the tokens only where the Worker has them: WORKER_SECRETS).
name: deploy
on:
  workflow_dispatch:
    inputs:
      example:
        description: The example whose Worker to deploy
        type: choice
        options: [notes-go, notes-ts, start-datastar, start-go, start-htmx, start-ts]
        required: true
permissions:
  contents: read
concurrency: deploy-${{ inputs.example }}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      READ_TOKEN: ${{ secrets.READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.WRITE_TOKEN }}
    defaults:
      run:
        working-directory: examples/${{ inputs.example }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run cloudflare:token
      - run: mise run setup
      - run: mise run deploy
      - run: mise run live-test
