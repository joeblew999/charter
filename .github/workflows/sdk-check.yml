# charter's own sdk-check: the jobs of a repo that holds several projects (the tool, the libraries, examples/).
# Charter's own file, not the kit's: a project gets cmd/charter/kit/.github/workflows/charter-sdk-check.yml.
# Fern (in Docker): the Go and TypeScript SDKs generate from the committed specs and work, and the
# committed Go SDK (sdk/go) is what the specs generate.
name: sdk-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [examples/notes-go, examples/notes-ts, examples/start-datastar, examples/start-go, examples/start-htmx, examples/start-ts, conformance/showcase-go, conformance/showcase-ts]
        group: [go, typescript]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:gen ${{ matrix.group }}
      - run: mise run sdk:check ${{ matrix.group }}
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/notes-go
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:publish:check
