# Written by `charter workflows` from its template (github.com/joeblew999/charter, cmd/charter/workflows/release.yml):
# change the template, not this file. Every step that does work is a mise task, so it runs locally too.
# A release is cut from a developer's machine (mise run release -- vX.Y.Z), which builds and attaches
# everything. On its tag this builds it all again on GitHub's machines, as a check, attaches only what the
# Release lacks (everything, if the tag was pushed by hand), rewrites SHA256SUMS, tags the Go modules in
# subdirectories and, if the project has a CLI, starts the Windows one on Windows. On a pull request or
# by hand it is a dry run: the same build, kept as workflow artifacts, nothing published.
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [cmd/**, go/**, ts/**, examples/**, .goreleaser.yaml, mise.toml, go.mod, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  # The tool itself: GoReleaser puts its archives and checksums onto the Release.
  tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # GoReleaser writes the changelog from the history
      - uses: jdx/mise-action@v5.0.1
      - run: mise run charter:release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: charter
          path: dist/
          if-no-files-found: error
      - run: mise run release:tags
  # The TypeScript library: its npm package, which a project installs from the Release's URL.
  ts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run ts:setup
      - run: mise run ts:dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ts
          path: dist/
          if-no-files-found: error
      - run: mise run ts:release
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [notes-go, notes-ts]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the Release's description lists the commits since the last tag
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sdk-${{ matrix.example }}
          path: examples/${{ matrix.example }}/dist/
          if-no-files-found: error
      - run: mise run release:publish
  # The CLI, if the project has one (the cli group in fern/generators.yml), for Linux and Windows on
  # amd64 and arm64, cross-built with zig (darwin's need a Mac: the release cut from one has them).
  # amd64 only: the binaryen the tool pins has no linux/arm64 build, so mise can't install it on an
  # arm runner.
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [notes-go, notes-ts]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the Release's description lists the commits since the last tag
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run sdk:dist:cli
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-${{ matrix.example }}
          path: examples/${{ matrix.example }}/dist/
          if-no-files-found: error
      - run: mise run release:publish
  # The Windows CLI the cli job built, started on Windows: no other machine can start it.
  cli-windows:
    needs: cli
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [notes-go, notes-ts]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - uses: actions/download-artifact@v7.0.0
        with:
          name: cli-${{ matrix.example }}
          path: examples/${{ matrix.example }}/dist/
      - run: mise run sdk:cli:smoke
