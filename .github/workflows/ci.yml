# Go and Node are all a machine needs: go.mod's toolchain line and package-lock.json pin the rest.
# One job per push: the library's tests, then the one example checked, tested on wrangler dev, and worked on under
# charter dev.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go build ./... && go vet ./...
        env:
          GOWORK: "off"
      - run: go tool charter check
        working-directory: example
      # Generated Go and the skills are committed: what a clone has is what the sources give.
      - run: git diff --exit-code
      - run: go test ./...
        env:
          GOWORK: "off"
      - run: go tool charter test
        working-directory: example
      - run: go test -count=1 -run TestDev -v -timeout 15m ./test/devloop
        working-directory: example
        env:
          CHARTER_DEV_TEST: "1"
