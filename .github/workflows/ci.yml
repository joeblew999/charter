# mise is all a machine needs: mise.toml pins Go, Node and fnox (.github/actions/tools installs them), package-lock.json
# pins the rest.
# One job per push: the library's tests, then the example checked, tested on wrangler dev, and worked on under
# charter dev, and charter's own site checked and tested.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - run: npm ci
      - run: go build ./... && go vet ./...
        env:
          GOWORK: "off"
      - run: go tool charter check
        working-directory: example
      - run: go test ./...
        env:
          GOWORK: "off"
      - run: go tool charter test
        working-directory: example
      - run: go test -count=1 -run TestDev -v -timeout 15m ./test/devloop
        working-directory: example
        env:
          CHARTER_DEV_TEST: "1"
      - run: go tool charter check && go tool charter test
        working-directory: site
