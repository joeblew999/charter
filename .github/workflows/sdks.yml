# The API's clients in every language charter.toml's [pack] names, generated by Fern and each proved in its own
# language (charter pack -prove: containers, minutes). Locally charter runs them on Kiri; here on the runner's Docker.
# Its own flow, so a push is never held up by it: it runs when the contract's specs change, and by hand.
name: sdks

on:
  push:
    branches: [main]
    paths: ["example/fern/**", "example/charter.toml"]
  workflow_dispatch:

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go tool charter pack -prove
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: sdks
          path: example/sdk/out
          if-no-files-found: error
