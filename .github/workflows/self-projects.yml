# Written by `charter init` from charter.toml: don't edit, change charter.toml's [ci.jobs], then charter init.
# Every project's check (charter check): lint, its specs, its tests natively (Go) and under workerd. Here: charter ci projects [<project>]; on GitHub, from here: charter ci projects [<project>] -remote.
name: self-projects
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: One project (none, every project)
        type: string
        default: ""
jobs:
  projects:
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.project && format('["{0}"]', inputs.project) || '["examples/conformance-go","examples/conformance-ts","examples/notes-go","examples/notes-ts","examples/start-datastar","examples/start-go","examples/start-htmx","examples/start-ts"]') }}
    uses: ./.github/workflows/charter-ci.yml
    with:
      job: projects
      project: ${{ matrix.project }}
      runs-on: ubuntu-24.04
      timeout-minutes: 60
