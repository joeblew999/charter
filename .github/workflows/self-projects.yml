# Written by `charter-ts adopt` from ci.config.ts: don't edit, change ci.config.ts, then npm run adopt.
# Every project's check: lint, its specs, its tests natively (Go) and under workerd. Here: npm run ci -- projects [<project>]; on GitHub, from here: npm run ci -- projects [<project>] --remote.
name: self-projects
on:
  push:
    branches: [main]
    tags: ["ts-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: One project (none, every project)
        type: string
        default: ""
jobs:
  projects:
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.project && format('["{0}"]', inputs.project) || '["examples/start-ts","examples/notes-ts","examples/conformance-ts","examples/notes-go","examples/start-go","examples/start-htmx","examples/start-datastar","examples/conformance-go"]') }}
    uses: ./.github/workflows/charter-ci.yml
    with:
      job: projects
      project: ${{ matrix.project }}
      runs-on: ubuntu-24.04
      timeout-minutes: 60
