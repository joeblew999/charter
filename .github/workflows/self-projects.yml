# Written by `charter-ts ci:write` from ci.config.ts: don't edit, change ci.config.ts, then npx charter-ts ci:write.
# Every project's check: lint, its specs, its tests natively (Go) and under workerd. The same job here: npx charter-ts ci projects [<project>]; on GitHub, from here: npx charter-ts ci:remote projects [<project>].
name: self-projects
on:
  push:
    branches: [main]
    tags: ["ts-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: One project (none, every project)
        type: string
        default: ""
jobs:
  projects:
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.project && format('["{0}"]', inputs.project) || '["ts/examples-start","ts/examples-notes","ts/conformance","go/examples-notes","go/examples-start","go/examples-start-htmx","go/examples-start-datastar","go/conformance"]') }}
    uses: ./.github/workflows/charter-ci.yml
    with:
      job: projects
      project: ${{ matrix.project }}
      runs-on: ubuntu-24.04
      timeout-minutes: 60
