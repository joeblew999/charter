# Written by `dev workflows` from its template (github.com/joeblew999/orpc-api/dev, dev/workflows/api-check.yml):
# change the template, not this file. Every step that does work is a mise task, so it runs locally too.
# The local checks (no Cloudflare account) of both APIs and the Go showcase: one job each, so a failure names its part.
name: api-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-ts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run api:ts:check
  api-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run api:go:check
  showcase-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run setup
      - run: mise run showcase:go:check
