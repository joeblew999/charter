# Written by `charter init` from charter.toml: don't edit, change charter.toml's [ci.jobs], then charter init.
# The weekly update: every pin moved to its latest (charter update), checked, and what changed opened as a pull request. Here: charter ci pins; on GitHub, from here: charter ci pins -remote.
name: self-pins
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  pins:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/charter-ci.yml
    with:
      job: pins
      runs-on: ubuntu-24.04
      timeout-minutes: 90
