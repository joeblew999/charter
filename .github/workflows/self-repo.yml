# Written by `charter-ts ci:write` from ci.config.ts: don't edit, change ci.config.ts, then npx charter-ts ci:write.
# What charter checks in any repo: the kit and the docs (docs:check), the repo on GitHub as package.json says (repo --check), the upstream issues the code works around. The same job here: npx charter-ts ci repo; on GitHub, from here: npx charter-ts ci:remote repo.
name: self-repo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  repo:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      pages: read
    uses: ./.github/workflows/charter-ci.yml
    with:
      job: repo
      runs-on: ubuntu-24.04
      timeout-minutes: 10
