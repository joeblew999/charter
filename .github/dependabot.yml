version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/example"]
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
    # gsx's Vite plugin says which Vite it works with (its peer dependency): a new major waits for it.
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
