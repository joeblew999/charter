# Charter's project tasks: a project includes this folder by tag (mise.toml, [task_config] includes),
# and its tasks run in the project (dir), calling the tool as CHARTER_TOOL (its mise.toml sets it).
# The tasks every charter project has: what it needs, and the upstream issues it works around.

["doctor"]
description = "Check what the tasks need: npm packages, Docker, Go, Rust"
dir = "{{config_root}}"
run = "{{env.CHARTER_TOOL}} doctor"

["upstream:status"]
description = "The upstream issues the code works around (every `Upstream:` tag): CLOSED means that workaround can go"
dir = "{{config_root}}"
run = "{{env.CHARTER_TOOL}} upstream"
