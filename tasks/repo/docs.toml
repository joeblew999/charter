# Charter's tasks for any repo: a repo includes this folder by tag (mise.toml, [task_config] includes),
# whether or not it is a charter project, and gets these tasks and no others. They run at the repo's
# root (dir) and call the tool as CHARTER_TOOL, or as charter when the repo does not set it (it pins
# the tool under [tools]). Not here: releases, workflows, SDKs, Cloudflare (tasks/shared).
# The docs site in docs/, which GitHub Pages renders, and charter's own pages in docs/charter/.

["adopt"]
description = "Write charter's kit into this repo as this release has it: docs/charter/, the docs site's files, the issue forms, the workflows, AGENTS.md, CLAUDE.md, renovate.json; never a file of the repo's own"
dir = "{{config_root}}"
run = "{{ env.CHARTER_TOOL | default(value='charter') }} adopt"

["docs:setup"]
description = "Write charter's kit (charter adopt), then the pages docs/_generated.toml lists"
dir = "{{config_root}}"
run = "{{ env.CHARTER_TOOL | default(value='charter') }} adopt && {{ env.CHARTER_TOOL | default(value='charter') }} docs"

["docs:lint"]
description = "Check docs/ for what a program can check: front matter, links, the index, tasks and paths that don't exist"
dir = "{{config_root}}"
run = "{{ env.CHARTER_TOOL | default(value='charter') }} docs-lint"

["docs:check"]
description = "Fail if a file of charter's kit or a generated page differs from what docs:setup writes, or docs/ fails the lint"
dir = "{{config_root}}"
run = "{{ env.CHARTER_TOOL | default(value='charter') }} adopt -check && {{ env.CHARTER_TOOL | default(value='charter') }} docs -check && {{ env.CHARTER_TOOL | default(value='charter') }} docs-lint"

["docs:review"]
description = "Have Claude (the claude command) bring docs/ up to date and into line with docs/charter/writing.md"
dir = "{{config_root}}"
run = "{{ env.CHARTER_TOOL | default(value='charter') }} docs-review"

["docs:pages"]
description = "REMOTE, once per repo: turn on GitHub Pages for docs/ on main (GitHub renders the markdown itself)"
dir = "{{config_root}}"
run = 'gh api -X POST "repos/{owner}/{repo}/pages" -f "source[branch]=main" -f "source[path]=/docs"'
