# Written by `charter workflow` (github.com/joeblew999/charter): don't edit it; charter workflow writes
# it again. What it runs is charter.toml's [ci], through charter ci run: the tools, the build, a push's build
# published for its Workers Builds preview, the checks, and for a v* tag or a release/v* branch the release. Shell steps
# only: no JavaScript actions.
name: charter

# Every branch push, and a pull request from a fork (one from this repository already has its push run): read-only,
# since GitHub gives a fork's run no secrets and no write permission, and charter ci run publishes only for a push.
on:
  push:
  pull_request:

permissions:
  contents: write # the preview-builds pre-release, a release's tag and production branch
  pull-requests: write # the preview's URL on the pull request

concurrency:
  group: charter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # mise's GitHub downloads, the preview-builds upload and comment, a release's tag and production branch.
      # Cloudflare credentials never come here: Workers Builds deploys with its own token.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_YES: "1"
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: charter ci run
        run: |
          export MISE_TRUSTED_CONFIG_PATHS="$PWD" PATH="$HOME/.local/bin:$PATH"
          command -v mise >/dev/null ||
            curl -fsSL https://mise.run | MISE_VERSION="v$(sed -n 's/^min_version = "\(.*\)"/\1/p' mise.toml)" MISE_QUIET=1 sh
          mise install go github:joeblew999/charter
          mise exec -- charter ci run
