# The tools everyone builds charter with, on every machine and in CI, at these versions. mise installs them
# (mise install); mise.lock says what each download must be; Renovate keeps both current (.github/renovate.json5).
#
# Go is pinned here, not by go.mod: go.mod's go line is the oldest Go an app may build charter with, and is raised
# on purpose. wrangler and Vite are pinned by package-lock.json. An app made by charter create gets these pins as its
# own (charter create, charter upgrade).
[tools]
go = "1.27.4"
node = "26.13.1"
# By its GitHub releases: Renovate knows it by that name.
"github:jdx/fnox" = "1.50.0"

[settings]
# The systems charter is built and run on: what mise lock writes into mise.lock.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64"]
