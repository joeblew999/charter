# orpc-api: one notes API on Cloudflare Workers, twice (api/ = oRPC, api-go/ = Go), with SDKs, a CLI
# and docs generated by Fern. Everything runs through these tasks, locally and on GitHub alike.
#   mise install && mise run setup     # tools, then npm packages
#   mise run check                     # every local check (needs Docker, no Cloudflare account)
#   mise tasks                         # all of them
# Every task is one line. Anything longer is a command of ./dev (go run ./dev help).
# Tool versions: here; Rust in rust-toolchain.toml, Go in go.work (read by mise, see settings).

[settings]
idiomatic_version_file_enable_tools = ["rust", "go"]
# bash everywhere: on Linux mise's default sh is dash (no pipefail).
unix_default_inline_shell_args = "bash -o errexit -o pipefail -c"

[tools]
node = "26.10.0"
jq = "1.8.2"
gh = "2.101.0"
# api-go/: TinyGo builds the Go Worker's Wasm (workers-go needs >= 0.42.0), and runs wasm-opt (binaryen) doing it.
tinygo = "0.42.0"
"aqua:WebAssembly/binaryen" = "133"

[env]
# Local dev ports.
PORT = "{{ get_env(name='PORT', default='5173') }}"
API_GO_PORT = "{{ get_env(name='API_GO_PORT', default='5174') }}"
# Where the Workers are deployed (cf deploy prints it; there is no cf command to look it up). On
# another Cloudflare account, set these in mise.local.toml (gitignored).
API_URL = "{{ get_env(name='API_URL', default='https://orpc-api.gedw99.workers.dev') }}"
API_GO_URL = "{{ get_env(name='API_GO_URL', default='https://orpc-api-go.gedw99.workers.dev') }}"
HARNESS_URL = "{{ get_env(name='HARNESS_URL', default='https://orpc-sdk-harness.gedw99.workers.dev') }}"
HARNESS_API_URL = "{{ get_env(name='HARNESS_API_URL', default='https://orpc-sdk-harness-api.gedw99.workers.dev') }}"
# Optional: an API token instead of cf's OAuth login (`api/node_modules/.bin/cf auth login`).
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

# ---- everything -----------------------------------------------------------------------------------

[tasks.setup]
description = "Install the npm packages: api/, api-go/ (cf), sdk/ (Fern), sdk/harness/"
run = "for dir in api api-go sdk sdk/harness; do npm ci --prefix $dir --no-fund --no-audit; done"

[tasks.check]
description = "Every LOCAL check (no Cloudflare account; needs Docker)"
depends = ["api:check", "api-go:check", "dev:check", "sdk:demo", "sdk:harness:test"]

[tasks.doctor]
description = "Check what the tasks need: npm installs, Docker, Go, TinyGo, Rust"
run = "go run ./dev doctor"

[tasks."upstream:status"]
description = "The upstream issues our code works around (every `Upstream:` tag): CLOSED means that workaround can go"
run = "go run ./dev upstream"

[tasks."dev:check"]
description = "The dev tool's own checks: gofmt, vet, tests"
run = 'test -z "$(gofmt -l dev)" && go vet ./dev && go test ./dev'

# ---- api/: the oRPC Worker (TypeScript) -------------------------------------------------------------

[tasks."api:dev"]
description = "The oRPC API on PORT (cf dev). First time, in another shell: mise run api:migrate:local"
dir = "api"
run = "./node_modules/.bin/cf dev"

[tasks."api:migrate:local"]
description = "Apply migrations/ to the local D1 of a running api:dev"
run = "go run ./dev migrate-local -worker orpc-api"

[tasks."api:spec"]
description = "Write both specs from the contract (api/src/contract.ts) into sdk/fern/apis/api/"
dir = "api"
run = 'node spec.ts ../sdk/fern/apis/api/openapi.json ../sdk/fern/apis/api/asyncapi.json "$API_URL"'

[tasks."api:spec:check"]
description = "Fail if a committed spec is stale against the contract"
dir = "api"
run = 'node spec.ts --check ../sdk/fern/apis/api/openapi.json ../sdk/fern/apis/api/asyncapi.json "$API_URL"'

[tasks."api:typecheck"]
description = "Typecheck the oRPC Worker"
dir = "api"
run = "./node_modules/.bin/cf workers types >/dev/null && ./node_modules/.bin/tsc"

[tasks."api:test"]
description = "Unit tests (follow(), the one real-time feed)"
dir = "api"
run = "./node_modules/.bin/vitest run"

[tasks."api:check"]
description = "LOCAL: typecheck, unit tests, and the committed specs match the contract"
depends = ["api:typecheck", "api:test", "api:spec:check"]

[tasks."api:deploy"]
description = "REMOTE: deploy the oRPC Worker (orpc-api), then apply pending D1 migrations"
dir = "api"
run = "./node_modules/.bin/cf deploy && go run ../dev migrate -worker orpc-api"

[tasks."api:migrate"]
description = "REMOTE: apply pending migrations/ to orpc-api-db"
run = "go run ./dev migrate -worker orpc-api"

[tasks."api:live-test"]
description = "REMOTE, writes test notes: SSE + WebSocket, raw and through the TypeScript SDK"
depends = ["sdk:ready api"]
run = 'node test/live-test.mjs "$API_URL" && node test/sdk-live-test.mjs "$API_URL" api'

[tasks."api:soak"]
description = "REMOTE, redeploys orpc-api: the real-time matrix, every client x scenario. --idle <min> for the long-idle case"
depends = ["sdk:ready api"]
run = 'node test/soak.mjs "$API_URL"'

# ---- api-go/: the Go Worker (Huma on workers-go, TinyGo) ---------------------------------------------

[tasks."api-go:run"]
description = "The Go API natively on API_GO_PORT: no Cloudflare, an in-memory store"
dir = "api-go"
run = "PORT=$API_GO_PORT go run ."

[tasks."api-go:build"]
description = "Build the Go Worker's Wasm with TinyGo into api-go/build (fails over 3 MB gzipped, the Workers Free limit)"
dir = "api-go"
# -stack-size: Huma overflows TinyGo's default stack ("memory access out of bounds" under workerd).
run = "go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=tinygo && tinygo build -o build/app.wasm -target wasm -no-debug -stack-size=256kb . && go run ../dev size -max 3000000 api-go/build/app.wasm"

[tasks."api-go:dev"]
description = "The Go API under workerd on API_GO_PORT (cf dev). First time: mise run api-go:migrate:local. After a Go change: mise run api-go:build"
depends = ["api-go:build"]
dir = "api-go"
run = "PORT=$API_GO_PORT ./node_modules/.bin/cf dev"

[tasks."api-go:migrate:local"]
description = "Apply migrations/ to the local D1 of a running api-go:dev"
run = "go run ./dev migrate-local -worker orpc-api-go"

[tasks."api-go:spec"]
description = "Write both specs from the Go contract (api-go/api/contract.go) into sdk/fern/apis/api-go/"
dir = "api-go"
run = 'go run ./cmd/spec ../sdk/fern/apis/api-go/openapi.json ../sdk/fern/apis/api-go/asyncapi.json "$API_GO_URL"'

[tasks."api-go:spec:check"]
description = "Fail if a committed spec is stale against the Go contract"
dir = "api-go"
run = 'go run ./cmd/spec -check ../sdk/fern/apis/api-go/openapi.json ../sdk/fern/apis/api-go/asyncapi.json "$API_GO_URL"'

[tasks."api-go:lint"]
description = "gofmt and go vet, for the host and for Wasm"
dir = "api-go"
run = 'test -z "$(gofmt -l .)" && go vet ./... && GOOS=js GOARCH=wasm go vet .'

[tasks."api-go:test"]
description = "Go tests: follow, the API, and the same SDK surface as the oRPC contract"
dir = "api-go"
run = "go test ./..."

[tasks."api-go:test:native"]
description = "The real-time live test against the native build"
run = 'go run ./dev with-server -dir api-go -url http://localhost:5396/api/hello -start "PORT=5396 go run ." -run "node ../test/live-test.mjs http://localhost:5396"'

[tasks."api-go:test:workerd"]
description = "The real-time live test against the TinyGo Wasm under workerd (go test can't see TinyGo's gaps)"
depends = ["api-go:build"]
run = 'go run ./dev with-server -dir api-go -url http://localhost:5397/api/hello -start "PORT=5397 ./node_modules/.bin/cf dev" -run "go run ../dev migrate-local -worker orpc-api-go -port 5397" -run "node ../test/live-test.mjs http://localhost:5397"'

[tasks."api-go:check"]
description = "LOCAL: lint, tests, spec drift, the TinyGo build, and the live test natively and under workerd"
depends = ["api-go:lint", "api-go:test", "api-go:spec:check", "api-go:test:native", "api-go:test:workerd"]

[tasks."api-go:deploy"]
description = "REMOTE: build and deploy the Go Worker (orpc-api-go), then apply pending D1 migrations"
depends = ["api-go:build"]
dir = "api-go"
run = "./node_modules/.bin/cf deploy && go run ../dev migrate -worker orpc-api-go"

[tasks."api-go:migrate"]
description = "REMOTE: apply pending migrations/ to orpc-api-go-db"
run = "go run ./dev migrate -worker orpc-api-go"

[tasks."api-go:live-test"]
description = "REMOTE, writes test notes: SSE + WebSocket, raw and through the TypeScript SDK made from the Go specs"
depends = ["sdk:ready api-go"]
run = 'node test/live-test.mjs "$API_GO_URL" && node test/sdk-live-test.mjs "$API_GO_URL" api-go'

[tasks."api-go:soak"]
description = "REMOTE, redeploys orpc-api-go: the real-time matrix, with the SDKs and CLI made from the Go specs. --idle <min> for the long-idle case"
depends = ["sdk:ready api-go"]
run = 'node test/soak.mjs "$API_GO_URL" --sdk api-go --deploy-task api-go:deploy'

# ---- sdk/: Fern (each API is sdk/fern/apis/<api>/ with its specs and a generators.yml) --------------

[tasks."sdk:list"]
description = "The APIs in sdk/fern/apis and the SDK groups each one defines"
run = "go run ./dev sdk-list"

[tasks."sdk:check-spec"]
description = "Validate an API's specs and config with Fern: mise run sdk:check-spec <api>"
dir = "sdk"
run = "./node_modules/.bin/fern check --warnings --api"

[tasks."sdk:gen"]
description = "Generate an SDK with Fern (Docker): mise run sdk:gen <api> <group> -> sdk/out/<api>/<group>"
run = "go run ./dev sdk-gen"

[tasks."sdk:check"]
description = "Prove a generated SDK works (Go: build, vet, tests against WireMock; TypeScript: typecheck): mise run sdk:check <dir>"
run = "go run ./dev sdk-check"

[tasks."sdk:ready"]
description = "Generate and build what the tests use, if missing (TypeScript and Go SDKs, the Fern CLI): mise run sdk:ready <api>"
run = "go run ./dev sdk-ready"

[tasks."sdk:demo"]
description = "Small end-to-end run: Go + TypeScript SDKs for the petstore API, checked"
run = "for group in go typescript; do go run ./dev sdk-gen petstore $group && go run ./dev sdk-check sdk/out/petstore/$group; done"

[tasks."sdk:cli:build"]
description = "HEAVY: build a Fern-generated Rust CLI: mise run sdk:cli:build [-linux] <dir>, e.g. sdk/out/api/cli"
run = "go run ./dev cli-build"

[tasks."sdk:docs"]
description = "Preview the API docs site locally (fern docs dev): http://localhost:3030"
dir = "sdk"
# Fern runs its preview app from ~/.fern, outside this repo: tell mise's shims which node to use there.
env = { MISE_NODE_VERSION = "26.10.0" }
run = "./node_modules/.bin/fern docs dev --port 3030"

[tasks."sdk:cloudflare"]
description = "HEAVY (26 MB spec): add Cloudflare products as an API, sliced from Forge's spec: mise run sdk:cloudflare [-products d1,kv]"
run = "go run ./dev cloudflare-spec"

[tasks."sdk:clean"]
description = "Remove generated SDKs (sdk/out) and stop leftover WireMock containers"
run = "go run ./dev sdk-clean"

[tasks."sdk:harness:test"]
description = "Run Fern's TypeScript SDK inside a Worker (sdk/harness): under cf dev, or with -remote the deployed one"
run = "go run ./dev harness-test"

[tasks."sdk:harness:deploy"]
description = "REMOTE: deploy the harness Worker twice (orpc-sdk-harness and orpc-sdk-harness-api)"
run = "go run ./dev harness-deploy"
