# charter: contract-first APIs on Cloudflare Workers, in Go. The tool (cmd/charter), the Go library
# (go/), the TypeScript library (ts/), six example projects (examples/: notes and start, each in Go and TypeScript, and start-htmx and start-datastar: start in Go with server-rendered pages) and two conformance projects
# (conformance/: every Fern feature, end to end). This file has the tasks of the repo as a whole.
# Each is a complete project with a mise.toml of its own and
# the same task names (setup, check, build, spec, deploy, sdk:gen ...): cd into it and run them there.
#   mise install && mise run setup     # tools, then every project's npm packages
#   mise run check                     # every local check (needs Docker, no Cloudflare account)
#   mise tasks                         # all of them
# Every task is one line that sh and Windows' cmd.exe both take: programs, "double quotes", &&.
# Anything else is a command of the tool: go run ./cmd/charter help.

[tools]
go = "1.27.1"
# The TypeScript library (ts/): its checks, mise run ts:check.
node = "26.10.0"
jq = "1.8.2"
gh = "2.101.0"
# Builds and publishes the tool (.goreleaser.yaml): mise run charter:release.
goreleaser = "2.18.2"
# Holds the Cloudflare credentials (the keychain, through fnox): mise run cloudflare:secrets.
fnox = "1.35.2"

[env]
# How the tasks this repo includes run the tool: from this checkout.
CHARTER_TOOL = "go run ./cmd/charter"

[task_config]
# The tasks any repo takes from charter (tasks/repo: the repo on GitHub, the docs site in docs/, the
# issues, the upstream issues), as this repo takes them itself. A repo elsewhere includes the folder
# from GitHub, by tag.
includes = ["tasks/repo"]

# ---- everything ----------------------------------------------------------------------------------

[tasks.setup]
description = "Install every example's npm packages (its own mise run setup)"
run = "go run ./cmd/charter each setup"

[tasks.check]
description = "Every LOCAL check (no Cloudflare account; needs Docker): the tool, the Go library, the TypeScript library, then each project's own check"
depends = ["charter:check", "go:check", "ts:check", "projects:check"]

[tasks."projects:check"]
description = "LOCAL: mise run check in every project (examples/ and conformance/), one after the other, against the TypeScript library as built now"
depends = ["ts:build"]
run = "go run ./cmd/charter each check"

[tasks.compare]
description = "REMOTE, writes test notes: the same bench against the TypeScript notes Worker and then the Go one, with writes and the CPU of each request: are they level? About two minutes"
run = "go run ./cmd/charter each -only notes-ts,notes-go bench -each -write -warm 20s -n 30"

[tasks.doctor]
description = "Check what each example's tasks need: npm packages, Docker, Go, Rust (with a CLI)"
run = "go run ./cmd/charter each doctor"

[tasks."sdk:clean"]
description = "Remove every example's generated SDKs and stop leftover WireMock containers"
run = "go run ./cmd/charter each sdk:clean"

# ---- charter: the tool (cmd/charter) and what it writes ------------------------------------------

[tasks."ci:scope"]
description = "In the check workflow: which Windows and macOS jobs to run (all on a push; on a pull request, those for what it changes)"
run = "go run ./cmd/charter ci-scope"

[tasks."charter:check"]
description = "The tool's own checks (gofmt, vet, tests, with the test that holds the two notes examples to one surface), the generated workflows and docs config match their templates, and docs/ passes the lint"
run = "go run ./cmd/charter lint -vet ./cmd/...,./examples cmd examples/*.go && go test ./cmd/... ./examples && go run ./cmd/charter workflows -check && go run ./cmd/charter docs -check && go run ./cmd/charter docs-lint"

[tasks.catalog]
description = "REMOTE, read-only: the owner's charter repos, what each publishes, and the repos that pin it, as Markdown (-- -json for JSON, -- -page for a docs page)"
run = "go run ./cmd/charter catalog"

[tasks.workflows]
description = "Write .github/workflows/ from the templates in cmd/charter/workflows (edit those, never the copies)"
run = "go run ./cmd/charter workflows"

[tasks.release]
description = "REMOTE: cut a release of the repo from this machine: mise run release -- vX.Y.Z [-dry-run]. Runs check and dist, tags, pushes, makes the GitHub Release, runs release:publish and release:tags"
run = "go run ./cmd/charter release"

[tasks.dist]
description = "HEAVY: what the notes examples ship (their SDKs, specs and CLI for every OS), each into its own dist/: what mise run release builds before the tag"
run = "go run ./cmd/charter each -only notes-go,notes-ts dist"

[tasks."release:publish"]
description = "REMOTE on a version tag (vX.Y.Z): the TypeScript library's package, then the tool (GoReleaser), then the notes examples' dist/, onto its GitHub Release. Anywhere else: the same as a dry run"
run = "go run ./cmd/charter dist-ts && go run ./cmd/charter publish && go run ./cmd/charter release-tool && go run ./cmd/charter each -only notes-go,notes-ts release:publish"

[tasks."charter:release"]
description = "GoReleaser on the tool (.goreleaser.yaml). REMOTE on a version tag (vX.Y.Z): archives and checksums go to its GitHub Release. Anywhere else: a snapshot into dist/"
run = "go run ./cmd/charter release-tool"

[tasks."release:tags"]
description = "REMOTE on a version tag (vX.Y.Z): tag the Go modules in subdirectories that others import (go/vX.Y.Z, examples/notes-go/sdk/go/vX.Y.Z). Anywhere else: a dry run"
run = "go run ./cmd/charter release-tags go examples/notes-go/sdk/go"

# ---- go: the Go library (go/) that a Go API on Workers imports, with the Worker glue (go/worker/) ----

[tasks."go:lint"]
description = "gofmt and go vet of the Go library, for the host and for Wasm"
dir = "go"
run = "go run ../cmd/charter lint -wasm ./... ."

[tasks."go:test"]
description = "The Go library's tests: humaworkers, transport, hub, follow, humamcp, asyncapi, specfile, auth, ratelimit"
dir = "go"
run = "go test ./..."

[tasks."go:check"]
description = "LOCAL: the Go library's lint and tests"
depends = ["go:lint", "go:test"]

# ---- ts: the TypeScript library (ts/), @charter/ts: a local package of the TypeScript examples here, a
# package on each GitHub release for a project elsewhere -------------------------------------------

[tasks."ts:setup"]
description = "Install the TypeScript library's npm packages and build it (each TypeScript example's setup does it too)"
dir = "ts"
run = "npm ci --no-fund --no-audit && npm run build"

[tasks."ts:build"]
description = "Compile the TypeScript library into ts/dist/ (JavaScript and types), which its package exports: after changing ts/src, before an example uses it"
dir = "ts"
run = "npm run build"

[tasks."ts:lint"]
description = "Typecheck the TypeScript library and its tests"
dir = "ts"
run = "go run ../cmd/charter exec tsc"

[tasks."ts:test"]
description = "The TypeScript library's tests: follow(), auth, ratelimit"
dir = "ts"
run = "go run ../cmd/charter exec vitest run"

[tasks."ts:check"]
description = "LOCAL: the TypeScript library's typecheck and tests"
depends = ["ts:lint", "ts:test"]

[tasks."ts:dist"]
description = "Build the TypeScript library and pack it into dist/charter-ts-X.Y.Z.tgz, X.Y.Z from the version tag (none: 0.0.0-dev): what a project installs from the release's URL"
run = "go run ./cmd/charter dist-ts"

[tasks."ts:release"]
description = "REMOTE on a version tag (vX.Y.Z): attach dist/* (what ts:dist wrote) to its GitHub Release, if it lacks them. Anywhere else: a dry run that lists dist/"
run = "go run ./cmd/charter publish"

# ---- cloudflare: the credentials a deploy from GitHub needs --------------------------------------

[tasks."cloudflare:secrets"]
description = "REMOTE, once per repo: copy CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from fnox into this repo's GitHub secrets, for the deploy workflow"
run = "fnox exec -- go run ./cmd/charter github-secrets CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID"
