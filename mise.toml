# The tools, and nothing else: every command is charter's (in this repo, go tool charter <command>), the repo's from
# charter.toml at the top, a project's from its own. This file is the one place the tools' versions are said: mise
# installs them here and on GitHub, Renovate moves them, charter runs them from here (mise exec: sqlc, TinyGo), and a
# new repo's mise.toml starts from them (internal/pins/repo.toml, held equal by a test). node runs the TypeScript
# (charter-lib, the projects' tests, Fern); go builds and tests the Go side, charter among it; gh is what the
# repo commands talk to GitHub with; fnox holds the secrets a deploy and a live test take (fnox exec --
# charter deploy production). tinygo and binaryen build a Go Worker: internal/cli/build patches this
# TinyGo's runtime, so a new TinyGo that the patch no longer fits fails the build and says so. sqlc
# types a Go project's queries (internal/dbcode). goreleaser builds the charter binary a release puts on GitHub (.goreleaser.yaml),
# which a repo takes from mise. workerd runs a Worker locally (charter dev, check, with), as Cloudflare does.
[tools]
go = "1.27.3"
gh = "2.103.3"
node = "26.13.0"
# github:, not mise's packslip install: packslip fails on fnox's skill (a 404 upstream, mise 2026.10.22).
# github: still checks the checksum and fnox's GitHub artifact attestations.
"github:jdx/fnox" = "1.44.0"
tinygo = "0.44.0"
"aqua:WebAssembly/binaryen" = "133"
"aqua:sqlc-dev/sqlc" = "1.31.1"
goreleaser = "2.18.3"
workerd = "1.20261019.1"
