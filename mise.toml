# orpc-api: an oRPC API on Cloudflare Workers, contract first, with real-time (SSE + WebSockets) and
# SDKs, a CLI and docs generated by Fern. Everything runs through these tasks: `mise tasks` lists them.
#   mise install && mise run setup     # tools, then npm packages
#   mise run dev                       # local API on PORT
#   mise run check                     # every local check (needs Docker, no Cloudflare account)
# Tool versions: node/jq/gh here; Rust in rust-toolchain.toml, Go in go.work (read by mise, see settings).

[settings]
idiomatic_version_file_enable_tools = ["rust", "go"]

[tools]
node = "26.10.0"
jq = "1.8.2"
gh = "2.101.0"

[env]
PORT = "{{ get_env(name='PORT', default='5173') }}"
# Where the API is deployed (cf deploy prints it; there is no cf command to look it up). On another
# Cloudflare account, set these in mise.local.toml (gitignored).
API_URL = "{{ get_env(name='API_URL', default='https://orpc-api.gedw99.workers.dev') }}"
HARNESS_URL = "{{ get_env(name='HARNESS_URL', default='https://orpc-sdk-harness.gedw99.workers.dev') }}"
HARNESS_API_URL = "{{ get_env(name='HARNESS_API_URL', default='https://orpc-sdk-harness-api.gedw99.workers.dev') }}"
# Optional: an API token instead of cf's OAuth login (`api/node_modules/.bin/cf auth login`).
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

# ---------------------------------------------------------------------------------------------------
# Setup and the whole local check
# ---------------------------------------------------------------------------------------------------

[tasks.setup]
shell = "bash -o errexit -c"
description = "Install the npm packages: api/ (oRPC, cf), sdk/ (Fern), sdk/harness/ (the SDK test Worker)"
run = [
  "npm ci --prefix api --no-fund --no-audit",
  "npm ci --prefix sdk --no-fund --no-audit",
  "npm ci --prefix sdk/harness --no-fund --no-audit",
]

[tasks.check]
shell = "bash -o errexit -c"
description = "Every LOCAL check (no Cloudflare account; needs Docker): api:check, sdk:demo, sdk:harness:test"
run = '''
failed=0
for task in api:check sdk:demo sdk:harness:test; do
  echo "== $task"
  log=$(mktemp)
  if mise run -q "$task" >"$log" 2>&1; then echo "   ok"; else echo "   FAILED:"; tail -15 "$log" | sed 's/^/   /'; failed=1; fi
  rm -f "$log"
done
exit $failed
'''

[tasks."upstream:status"]
shell = "bash -o errexit -c"
description = "Upstream issues our code works around (every `Upstream: <repo>#<n>` tag) and their state: CLOSED means that workaround can go (table in api/README.md)"
run = '''
set -euo pipefail
tags=$(git grep -n -o -E 'Upstream: [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+.*' -- ':!*.md' ':!mise.toml')
issues=$(echo "$tags" | grep -o -E '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+' | sort -u)
total=0; closed=0
for issue in $issues; do
  total=$((total + 1))
  info=$(gh api "repos/${issue%#*}/issues/${issue#*#}" --jq '.state + "\t" + .title' 2>/dev/null || printf 'unreachable\t')
  state=${info%%$'\t'*}; title=${info#*$'\t'}
  [ "$state" = closed ] && closed=$((closed + 1))
  echo "$(echo "$state" | tr '[:lower:]' '[:upper:]')  $issue  $title"
  echo "$tags" | grep -F "Upstream: $issue " | sed -E 's/^([^:]+:[0-9]+):Upstream: [^ ]+ *(.*)$/        \1  \2/'
done
echo
echo "$total upstream issues, $closed closed$([ "$closed" -gt 0 ] && echo ': remove those workarounds (api/README.md)' || true)"
'''

# ---------------------------------------------------------------------------------------------------
# api/: the oRPC Worker (contract first) on D1, with the NotesHub Durable Object
# ---------------------------------------------------------------------------------------------------

[tasks.dev]
shell = "bash -o errexit -c"
description = "Local dev server for the API on PORT (cf dev). First run: mise run db:migrate:local in another shell"
dir = "{{config_root}}/api"
run = "./node_modules/.bin/cf dev"

[tasks."db:migrate:local"]
shell = "bash -o errexit -c"
description = "LOCAL: apply api/migrations/*.sql to the dev server's D1 (each once; cf can't migrate the local DB). Needs mise run dev"
dir = "{{config_root}}/api"
run = '''
set -euo pipefail
base="http://localhost:$PORT/cdn-cgi/local/explorer/api/d1/database/DB-orpc-api/raw"
sql() { curl -fsS -X POST "$base" -H 'content-type: application/json' -d "$(jq -n --arg s "$1" '{sql: $s}')" \
  || { echo "no dev server on port $PORT: mise run dev" >&2; exit 1; }; }
sql 'CREATE TABLE IF NOT EXISTS _local_migrations (name TEXT PRIMARY KEY, applied_at TEXT DEFAULT CURRENT_TIMESTAMP)' >/dev/null
applied=0
for file in migrations/*.sql; do
  name=$(basename "$file")
  done_before=$(sql "SELECT count(*) FROM _local_migrations WHERE name = '$name'" | jq -r '.result[-1].results.rows[0][0]')
  [ "$done_before" = 0 ] || continue
  sql "$(cat "$file")" >/dev/null
  sql "INSERT INTO _local_migrations (name) VALUES ('$name')" >/dev/null
  echo "applied $name"; applied=$((applied + 1))
done
echo "local DB-orpc-api: $applied migration(s) applied"
'''

[tasks.deploy]
shell = "bash -o errexit -c"
description = "REMOTE: deploy the API Worker (orpc-api) with cf, then apply pending D1 migrations"
dir = "{{config_root}}/api"
run = [
  "./node_modules/.bin/cf deploy",
  "mise run -q db:migrate",
]

[tasks."db:migrate"]
shell = "bash -o errexit -c"
description = "REMOTE: apply pending api/migrations to the deployed D1 database (orpc-api-db)"
dir = "{{config_root}}/api"
run = '''
set -euo pipefail
# cf d1 takes UUIDs only; lists return one page unless asked for more.
uuid=$(./node_modules/.bin/cf d1 list --name orpc-api-db --per-page 100 | jq -r '.[] | select(.name == "orpc-api-db") | .uuid')
[ -n "$uuid" ] || { echo "no D1 database orpc-api-db yet: mise run deploy" >&2; exit 1; }
./node_modules/.bin/cf d1 migrations apply "$uuid"
'''

[tasks."api:spec"]
shell = "bash -o errexit -c"
description = "Write the OpenAPI and AsyncAPI specs from the contract (api/src/contract.ts) into sdk/fern/apis/api/, with API_URL as their server"
dir = "{{config_root}}/api"
run = 'node spec.ts ../sdk/fern/apis/api/openapi.json ../sdk/fern/apis/api/asyncapi.json "$API_URL"'

[tasks."api:check"]
shell = "bash -o errexit -c"
description = "LOCAL: the API's checks: typecheck, unit tests (follow()), and both committed specs match the contract"
dir = "{{config_root}}/api"
run = '''
set -euo pipefail
./node_modules/.bin/cf workers types >/dev/null && ./node_modules/.bin/tsc && echo "typecheck ok"
./node_modules/.bin/vitest run >/dev/null && echo "unit tests ok"
tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
node spec.ts "$tmp/openapi.json" "$tmp/asyncapi.json" "$API_URL" >/dev/null
for f in openapi asyncapi; do
  diff -q "$tmp/$f.json" "../sdk/fern/apis/api/$f.json" >/dev/null || { echo "sdk/fern/apis/api/$f.json is stale: mise run api:spec" >&2; exit 1; }
done
echo "specs match the contract"
'''

[tasks."api:test"]
shell = "bash -o errexit -c"
description = "Unit tests for the API (api/test: follow(), the one real-time feed)"
dir = "{{config_root}}/api"
run = "./node_modules/.bin/vitest run"

[tasks."api:live-test"]
shell = "bash -o errexit -c"
description = "REMOTE, writes test notes: the deployed API's real-time paths (raw SSE + WebSocket, then the generated TypeScript SDK)"
run = '''
set -uo pipefail
[ -f sdk/out/api/typescript-dist/esm/index.mjs ] || mise run -q sdk:gen api typescript-dist
failed=0
node api/live-test.mjs "$API_URL" || failed=1
node api/sdk-live-test.mjs "$API_URL" || failed=1
exit $failed
'''

[tasks."api:soak"]
shell = "bash -o errexit -c"
description = "REMOTE, redeploys orpc-api and writes test notes: the real-time matrix (every client x scenario: planned end, hub restart, client drop). --idle <min> for the long-idle case; other flags reach api/soak.mjs"
raw_args = true
# mise appends the arguments to the script: the function takes them.
run = '''
soak() { node api/soak.mjs "$API_URL" "$@"; }; soak'''

# ---------------------------------------------------------------------------------------------------
# sdk/: Fern (sdk/fern is a standard Fern project: each API is sdk/fern/apis/<api>/ with its spec and a
# generators.yml with one group per language). Generation needs Docker. See sdk/README.md.
# ---------------------------------------------------------------------------------------------------

[tasks."sdk:doctor"]
shell = "bash -o errexit -c"
description = "Check what Fern needs: its npm install, Docker, Go, Rust, FERN_TOKEN, leftover containers"
run = '''
ok() { printf '  ok    %s\n' "$1"; }; warn() { printf '  WARN  %s\n' "$1"; }; bad() { printf '  FAIL  %s\n' "$1"; failed=1; }
failed=0
[ -x sdk/node_modules/.bin/fern ] && ok "fern $(sdk/node_modules/.bin/fern --version | tail -1)" || bad "not installed: mise run setup"
docker info >/dev/null 2>&1 && ok "docker running" || bad "docker not running: start Docker"
command -v go >/dev/null && ok "$(go version | cut -d' ' -f3) (sdk:check on Go SDKs)" || warn "no go: mise install"
command -v cargo >/dev/null && ok "$(cargo --version) (sdk:cli:build:mac)" || warn "no cargo: mise install"
[ -n "${FERN_TOKEN:-}" ] && ok "FERN_TOKEN set" || warn "FERN_TOKEN not set: Fern documents local generation as an Enterprise feature needing it (it ran without one on 2026-09-30)"
left=$(docker ps -q --filter ancestor=wiremock/wiremock:3.9.1 2>/dev/null | wc -l | tr -d ' ')
[ "$left" = 0 ] && ok "no leftover WireMock containers" || warn "$left WireMock container(s) running: mise run sdk:clean"
echo "APIs: $(ls sdk/fern/apis | tr '\n' ' ')"
exit $failed
'''

[tasks."sdk:list"]
shell = "bash -o errexit -c"
description = "List the APIs in sdk/fern/apis and the SDK groups each one defines"
run = '''
for api in sdk/fern/apis/*/; do
  echo "$(basename "$api"): $(sed -n '/^groups:/,$p' "$api/generators.yml" | grep -E '^  [A-Za-z0-9_-]+:' | tr -d ' :' | tr '\n' ' ')"
done
'''

[tasks."sdk:check-spec"]
shell = "bash -o errexit -c"
description = "Validate an API's spec and config with Fern (fern check): mise run sdk:check-spec <api>"
usage = 'arg "<api>" help="a folder in sdk/fern/apis"'
dir = "{{config_root}}/sdk"
run = './node_modules/.bin/fern check --api "$usage_api" --warnings'

[tasks."sdk:gen"]
shell = "bash -o errexit -c"
description = "Generate an SDK with Fern (fern generate --local): mise run sdk:gen <api> <group> -> sdk/out/<api>/<group>"
usage = '''
arg "<api>" help="a folder in sdk/fern/apis"
arg "<group>" help="a group in its generators.yml, e.g. go, typescript, cli"
'''
dir = "{{config_root}}/sdk"
run = '''
docker info >/dev/null 2>&1 || { echo "Docker is not running: start it first." >&2; exit 1; }
./node_modules/.bin/fern generate --local --api "$usage_api" --group "$usage_group" --force --log-level warn
'''

[tasks."sdk:check"]
shell = "bash -o errexit -c"
description = "Prove a generated SDK works: Go = build + vet + its tests against Fern's WireMock mock; TypeScript = typecheck. mise run sdk:check <dir>"
usage = 'arg "<dir>" help="a directory made by sdk:gen, e.g. sdk/out/petstore/go"'
run = '''
set -euo pipefail
dir="$usage_dir"
if [ -f "$dir/go.mod" ]; then
  # Generated modules aren't in go.work: build them on their own.
  export GOWORK=off
  (cd "$dir" && go build ./... && echo "build ok" && go vet ./... && echo "vet ok")
  compose="$dir/wiremock/docker-compose.test.yml"
  if [ -f "$compose" ]; then
    docker compose -f "$compose" up -d --wait >/dev/null 2>&1
    trap 'docker compose -f "$compose" down >/dev/null 2>&1' EXIT
    # WireMock gets a random host port: tell the tests where it is.
    export WIREMOCK_URL="http://$(docker compose -f "$compose" port wiremock 8080)"
  fi
  (cd "$dir" && go test ./... >/dev/null && echo "tests ok")
else
  entry=""
  for f in "$dir/index.ts" "$dir/src/index.ts" "$dir/sdk/index.ts"; do [ -f "$f" ] && { entry="$f"; break; }; done
  [ -n "$entry" ] || { echo "$dir: no go.mod or index.ts" >&2; exit 1; }
  # A tsconfig beside the SDK that extends sdk/tsconfig.base.json (standard fetch, no Node types).
  printf '{ "extends": "%s", "include": ["%s"] }\n' "$PWD/sdk/tsconfig.base.json" "$(basename "$entry")" > "$(dirname "$entry")/tsconfig.check.json"
  sdk/node_modules/.bin/tsc -p "$(dirname "$entry")/tsconfig.check.json"
  echo "typecheck ok ($entry)"
fi
'''

[tasks."sdk:demo"]
shell = "bash -o errexit -c"
description = "Small end-to-end run: Go + TypeScript SDKs for the petstore API, checked"
run = '''
set -euo pipefail
for group in go typescript; do
  mise run -q sdk:gen petstore "$group"
  mise run -q sdk:check "sdk/out/petstore/$group"
done
'''

[tasks."sdk:cloudflare"]
shell = "bash -o errexit -c"
description = "HEAVY (26 MB spec, minutes of Docker): add Cloudflare products as an API (sdk/fern/apis/cloudflare), sliced from Forge's spec of the whole Cloudflare API: mise run sdk:cloudflare [--products d1,kv]"
usage = '''
flag "--products <list>" default="d1,kv" help="comma-separated: workers, d1, kv, r2, queues, workflows, ..."
flag "--release <sha>" default="6b0fb3cd63aca815f1667a8fa908114886867dc6" help="Forge openapi release"
'''
run = '''
set -euo pipefail
full=".forge/$usage_release.json"
api=sdk/fern/apis/cloudflare
mkdir -p .forge "$api"
[ -f "$full" ] || curl -fsSL -o "$full" "https://github.com/cloudflare/forge/releases/download/openapi@$usage_release/openapi.forge.json"
# Keep the account-level paths of the chosen products ("kv" lives under /storage/kv, "r2" under /r2/buckets).
prefixes=$(echo "$usage_products" | tr ',' '\n' | sed -e 's|^kv$|storage/kv|' -e 's|^r2$|r2/buckets|' | jq -R . | jq -s .)
jq --argjson p "$prefixes" '.paths |= with_entries(select(.key as $k | any($p[]; . as $x | $k | startswith("/accounts/{account_id}/" + $x))))' "$full" > "$api/openapi.json"
echo "$api/openapi.json: $(jq '[.paths[] | keys[] | select(. == "get" or . == "put" or . == "post" or . == "delete" or . == "patch")] | length' "$api/openapi.json") operations ($usage_products)"
[ -f "$api/generators.yml" ] || sed -e 's|/petstore/|/cloudflare/|g; s|example.com/petstore|example.com/cloudflare|; s|packageName: petstore|packageName: cloudflare|; s|namespaceExport: Petstore|namespaceExport: Cloudflare|' sdk/fern/apis/petstore/generators.yml > "$api/generators.yml"
echo "Now: mise run sdk:gen cloudflare go (or typescript, python)"
'''

[tasks."sdk:clean"]
shell = "bash -o errexit -c"
description = "Remove generated SDKs (sdk/out) and stop leftover WireMock containers"
run = '''
rm -rf sdk/out sdk/.work
ids=$(docker ps -q --filter ancestor=wiremock/wiremock:3.9.1 2>/dev/null)
[ -n "$ids" ] && docker rm -f $ids >/dev/null && echo "stopped WireMock containers"
echo "clean"
'''

[tasks."sdk:docs"]
shell = "bash -o errexit -c"
description = "Preview the API docs site for all APIs locally (fern docs dev, sdk/fern/docs.yml): http://localhost:3030"
dir = "{{config_root}}/sdk"
# Fern installs its preview app in ~/.fern/app-preview and runs node there, outside this repo:
# tell mise's shims which node to use for those child processes too.
env = { MISE_NODE_VERSION = "26.10.0" }
run = "./node_modules/.bin/fern docs dev --port 3030"

# --- Fern's CLI generator: a Rust CLI for an API (group `cli` in generators.yml, e.g. sdk/out/api/cli) ---
# Building is HEAVY the first time (compiles every Rust dependency: minutes at full CPU). All 7 targets
# come from the generated dist-workspace.toml (cargo-dist on GitHub Actions).

[tasks."sdk:cli:build:mac"]
shell = "bash -o errexit -c"
description = "HEAVY: build a generated Rust CLI natively for this Mac: mise run sdk:cli:build:mac <dir>"
usage = 'arg "<dir>" help="a CLI made by sdk:gen, e.g. sdk/out/api/cli"'
run = '''
set -euo pipefail
cd "$usage_dir"
bin=$(awk '/^\[\[bin\]\]/{f=1} f&&/^name/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
cargo build --release --bin "$bin" --no-default-features --features rustls
echo "built: $usage_dir/target/release/$bin (macOS)"
'''

[tasks."sdk:cli:build:linux"]
shell = "bash -o errexit -c"
description = "HEAVY: build a generated Rust CLI for Linux inside Docker (the container's arch): mise run sdk:cli:build:linux <dir>"
usage = 'arg "<dir>" help="a CLI made by sdk:gen, e.g. sdk/out/api/cli"'
run = '''
set -euo pipefail
dir="$(cd "$usage_dir" && pwd)"
bin=$(awk '/^\[\[bin\]\]/{f=1} f&&/^name/{gsub(/"/,"",$3);print $3;exit}' "$dir/Cargo.toml")
docker info >/dev/null 2>&1 || { echo "Docker is not running" >&2; exit 1; }
# Named volumes cache crates between runs; target-linux keeps it apart from a macOS build.
docker run --rm -v "$dir":/src -w /src -v orpc-api-cargo-registry:/usr/local/cargo/registry -e CARGO_TARGET_DIR=/src/target-linux "rust:$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
  cargo build --release --bin "$bin" --no-default-features --features rustls
echo "built: $usage_dir/target-linux/release/$bin (Linux)"
'''

# --- The TypeScript SDK on Cloudflare Workers (sdk/harness) ---
# The harness implements the showcase API itself (/api/mock/*), and /api/sdk-test runs the generated
# SDK against it inside workerd: pagination, OAuth, idempotency, SSE, webhook signatures, WebSockets.

[tasks."sdk:harness:sync"]
shell = "bash -o errexit -c"
description = "Copy the compiled showcase TypeScript SDK (group typescript-dist) into the harness Worker (sdk/harness/src/client)"
run = '''
set -euo pipefail
[ -f sdk/out/showcase/typescript-dist/index.js ] || mise run -q sdk:gen showcase typescript-dist
rm -rf sdk/harness/src/client
cp -R sdk/out/showcase/typescript-dist/esm sdk/harness/src/client
echo "SDK copied into sdk/harness/src/client"
'''

[tasks."sdk:harness:test"]
shell = "bash -o errexit -c"
description = "Run the SDK test in the harness Worker: locally under cf dev (default), or against the deployed Worker with --remote"
usage = 'flag "--remote" help="test the deployed harness (HARNESS_URL) instead of cf dev"'
run = '''
set -euo pipefail
mise run -q sdk:harness:sync >/dev/null
if [ "${usage_remote:-false}" = true ]; then
  base="$HARNESS_URL"
  # On Cloudflare the in-Worker WebSocket client needs a second Worker (a Worker can't call itself: 1042).
  target="?target=$HARNESS_API_URL"
else
  port=5398
  (cd sdk/harness && PORT=$port ./node_modules/.bin/cf dev >/dev/null 2>&1 &)
  trap 'lsof -ti :'$port' | xargs kill 2>/dev/null' EXIT
  for _ in $(seq 1 40); do curl -s -o /dev/null "localhost:$port/" && break; sleep 1; done
  base="http://localhost:$port"; target=""
fi
echo "Target: $base"
report='.results | to_entries[] | (if .value.ok then "PASS  \(.key)" else "FAIL  \(.key)  \(.value.detail | tostring | .[0:300])" end)'
failed=0
for path in "/api/sdk-test" "/api/ws-test$target"; do
  out=$(curl -s "$base$path")
  echo "$out" | jq -r "$report" || { echo "$out" | head -c 500; failed=1; }
  [ "$(echo "$out" | jq -r '.passed' 2>/dev/null)" = true ] || failed=1
done
node sdk/harness/ws-client.mjs "$base" || failed=1
exit $failed
'''

[tasks."sdk:harness:deploy"]
shell = "bash -o errexit -c"
description = "REMOTE: deploy the harness Worker twice: orpc-sdk-harness, and orpc-sdk-harness-api (--mode api, what the in-Worker WebSocket test connects to)"
dir = "{{config_root}}/sdk/harness"
run = '''
set -euo pipefail
mise run -q sdk:harness:sync
for mode in production api; do ./node_modules/.bin/cf deploy --mode "$mode"; done
'''
