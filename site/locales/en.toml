# The source catalog: every message the site's own pages show, in ICU MessageFormat. The docs are Markdown (docs/).

[site]
# The home page's title and description, in the browser's tab and in search results.
title = "charter: Go apps on Cloudflare Workers"
description = "Pages, an API from a contract, a live feed behind both, languages and search engines, in one Worker. One way, by convention."

[home]
# The home page: its heading and the lines under it.
heading = "Go apps on Cloudflare Workers, one way"
intro = "Pages, an API from a contract, a live feed behind both, languages and search engines, in one Worker."
# The three links under the heading.
docs = "Read the docs"
example = "See it running"
github = "The code on GitHub"
# The command that makes a new app, and the line above it.
start = "A new app, in three commands:"
# The cards: what charter gives an app.
pages_title = "Pages"
pages = "A structpages tree rendered with gsx and gsxui: one source of routes, links and the sitemap."
api_title = "An API from a contract"
api = "OpenAPI, AsyncAPI, MCP tools and SDKs in Go, Python and as a CLI, all from one Go contract."
live_title = "One live feed"
live = "Declared once: the page's live list, the API's stream and its WebSocket channel all come from it."
database_title = "A schema, not migrations"
database = "Tables are written down once. The migrations, the typed queries and the API's rows come from that."
world_title = "Languages and search engines"
world = "A URL per language, the runtime's own Intl, a sitemap, llms.txt and an audit on every push."
tests_title = "Tests that ask the real thing"
tests = "Pages in a real browser, the API through its own SDK, on wrangler dev and against the deployed Worker."

[gsxui]
close = "Close"
# The command list's name, as screen readers hear it.
suggestions = "Suggestions"
displays_the_mobile_sidebar = "Displays the mobile sidebar."
# Breadcrumb's "…" for levels left out.
more = "More"
sidebar = "Sidebar"
# The sidebar's toggle button, its label, and the description screen readers hear for it on phones.
toggle_sidebar = "Toggle Sidebar"
# Breadcrumb's and pagination's names as landmarks, and what screen readers call a carousel and each of its slides.
breadcrumb = "breadcrumb"

# charter's screens: the language list, the offer of the page in the reader's language, the time zone and clock dialog.
[screens]
# The text gsxui's components write themselves (i18n.T): charter add screen:<name> writes what the app's components use.
# The docs screen: its name (a badge beside the app's name, and the name of the list of its pages),
# the link to the repository ({repository} is its name, "owner/name"), the heading above a page's sections, and the
# link to the page's own file.
docs = "Docs"
docs_on_github = "{repository} on GitHub"
docs_on_this_page = "On this page"
docs_edit = "Edit this page on GitHub"
# The button that switches between the light and the dark theme, as screen readers name it.
theme = "Switch between light and dark"
# The button that switches between the light and the dark theme, as screen readers name it.
# The docs' search: its button and field, and what it says when no page or section matches.
docs_search = "Search the docs"
docs_none = "Nothing found."
# The docs on a phone: the button that opens the list of pages. And at the foot of a page, the labels above the
# links to the page before it and the page after it.
docs_previous = "Previous page"
docs_next = "Next page"
